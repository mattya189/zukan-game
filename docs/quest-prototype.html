<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【参考】クエストの試作（ゲームに組み込む前のもの）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#E3E8F1; --paper:#F7F9FC; --card:#FFFFFF; --ink:#1E2A4A; --soft:#4F5B7A; --line:#C4CEDD; --red:#D8364A; --blue:#2F6FD6; --gold:#C98F00; --green:#2FA36B;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace; --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141B2E; --paper:#1F2842; --card:#27314F; --ink:#EEF2FA; --soft:#B7C1DA; --line:#3A4670; } }
:root[data-theme="dark"] { --bg:#141B2E; --paper:#1F2842; --card:#27314F; --ink:#EEF2FA; --soft:#B7C1DA; --line:#3A4670; }
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after { box-sizing:inherit; }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--maru); font-weight:500; font-size:15px; line-height:1.7; -webkit-tap-highlight-color:transparent; }
button,select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.app { max-width:560px; margin:0 auto; padding:8px 10px 6px; height:100%; display:flex; flex-direction:column; gap:6px; }
html, body { height:100%; }
@supports (height: 100dvh) { .app { height:100dvh; } }
.top { display:flex; align-items:center; justify-content:space-between; gap:6px; flex:none; }
h1 { font-family:var(--dot); font-weight:400; font-size:16px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lead { display:none; }
.mini { border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:1px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
.versus { flex:none; display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:stretch; }
.vs { align-self:center; font-family:var(--dot); font-size:24px; color:var(--red); }
.corner { background:var(--paper); border-radius:12px; padding:6px; display:flex; flex-direction:column; gap:3px; border-top:5px solid var(--c); min-width:0; }
.corner .art { position:relative; height:clamp(96px, 31dvh, 280px); display:grid; place-items:center; border-radius:10px; overflow:hidden; background:radial-gradient(circle at 50% 65%, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%); }
.corner .art img { position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); object-fit:contain; object-position:center bottom; }
.corner select { width:100%; background:var(--bg); border:1.5px solid var(--line); border-radius:8px; padding:2px 4px; font-weight:700; font-size:12px; }
.grade { font-size:12px; font-weight:700; color:var(--soft); }
.grade b { display:inline-block; font-family:var(--dot); font-weight:400; color:#fff; background:var(--c); border-radius:6px; padding:0 6px; margin-right:4px; }
.ind { display:flex; justify-content:space-between; gap:2px; font-size:10px; color:var(--soft); white-space:nowrap; overflow:hidden; }
.ind b { font-family:var(--dot); font-weight:400; font-size:11px; color:var(--ink); margin-left:1px; }
.hpbar { height:10px; background:color-mix(in srgb, var(--soft) 25%, transparent); border-radius:99px; overflow:hidden; }
.hpbar i { display:block; height:100%; background:var(--green); transition:width .3s; }
.hpbar i.low { background:var(--red); }
.hpnum { font-family:var(--dot); font-size:12px; text-align:right; margin-top:-3px; min-height:1.2em; }
.panel { flex:none; background:var(--paper); border-radius:12px; padding:6px 8px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.row label { font-size:12px; font-weight:700; color:var(--soft); }
.row select { flex:1; min-width:140px; background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:6px; font-weight:700; }
.feats { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.feats button { border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:1px 10px; font-size:12px; font-weight:700; }
.feats button[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btns { flex:none; display:grid; grid-template-columns:1fr 1fr 1fr 1.5fr; gap:6px; }
.btn { border:2px solid var(--ink); background:var(--card); border-radius:12px; padding:8px 2px; font-weight:900; font-size:12px; white-space:nowrap; }
.btn.go { background:var(--red); border-color:var(--red); color:#fff; font-size:15px; }
.btn:disabled { opacity:.45; }
.btn.go.running { background:var(--card); color:var(--red); }
.feed { flex:1 1 auto; min-height:25dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--paper); border-radius:12px; padding:8px 10px; }
.feed:empty::before { content:"キャラと舞台を選んで「戦わせる」を押すと、実況が流れます。"; color:var(--soft); font-size:13px; }
.ev { margin:0 0 6px; font-size:15px; animation:in .2s; }
@keyframes in { from { opacity:0; transform:translateY(3px); } }
.ev.round { font-family:var(--dot); color:var(--soft); font-size:13px; margin-top:10px; border-top:1px dashed var(--line); padding-top:6px; }
.ev.stage { font-weight:900; }
.ev.talk { font-weight:700; }
.ev.skill { background:color-mix(in srgb, var(--gold) 16%, transparent); border-left:4px solid var(--gold); padding:4px 9px; border-radius:0 8px 8px 0; font-weight:700; }
.ev.big { background:color-mix(in srgb, var(--red) 14%, transparent); border-left:4px solid var(--red); padding:4px 9px; border-radius:0 8px 8px 0; font-weight:900; }
.goalbox { margin-top:8px; font-size:14px; background:var(--card); color:var(--ink); border-radius:10px; padding:8px 10px; text-align:left; line-height:1.6; }
.goalbox b { display:inline-block; margin-top:2px; font-size:15px; }
.goalbox b.ok { color:var(--green); } .goalbox b.ng { color:var(--red); }
.info dl { display:grid; grid-template-columns:5.5em 1fr; gap:4px 8px; margin:6px 0; font-size:14px; } .info dt { color:var(--soft); font-weight:700; font-size:12px; padding-top:2px; } .info dd { margin:0; }
.ev.sum { color:var(--soft); font-size:13px; background:var(--card); border-radius:8px; padding:4px 9px; }
.ev.info, .ev.miss { color:var(--soft); }
.ev b.s0 { color:var(--blue); } .ev b.s1 { color:var(--red); }
.ev .note { display:block; font-size:12px; color:var(--soft); font-weight:500; }
.result { margin-top:8px; text-align:center; background:var(--ink); color:var(--paper); border-radius:12px; padding:12px; }
.result h2 { margin:0; font-family:var(--dot); font-weight:400; font-size:24px; }
.result p { margin:2px 0 0; font-size:13px; opacity:.9; }
dialog.sheet { border:0; border-radius:16px; padding:12px; width:min(540px, 94vw); max-height:86dvh; overflow:auto; background:var(--paper); color:var(--ink); }
dialog.sheet::backdrop { background:rgba(10,15,30,.55); }
dialog.sheet h3 { margin:0 0 6px; font-size:15px; }
dialog.sheet .close { float:right; }
@media (max-height: 700px) { .ind, .hpnum { font-size:10px; } .ind b { font-size:11px; } .grade { font-size:11px; } }
@media (max-height: 620px) { .ind { display:none; } .corner .art { height:clamp(90px, 27dvh, 200px); } }
table.wr { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
table.wr th, table.wr td { padding:3px 2px; border-bottom:1px solid var(--line); text-align:center; }
table.wr th:first-child, table.wr td:first-child { text-align:left; white-space:nowrap; }
.wrap { overflow-x:auto; }
.small { font-size:12px; color:var(--soft); }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>マッチ神 クエスト（試作）</h1><button class="mini" id="openInfo">ステージ詳細</button></div>
  <p class="lead">10体の文章から作った技と弱点で戦います。1戦はおよそ30〜50ラウンド。舞台の特徴は両者に効きます。</p>
  <div class="versus"><div class="corner" id="c0"></div><div class="vs">VS</div><div class="corner" id="c1"></div></div>
  <div class="panel">
    <div class="row"><label for="quest">ステージ</label><select id="quest"></select></div>
    <p class="small" id="featLine" style="margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p>
  </div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="btns">
    <button class="btn" id="reroll">個体を引き直す</button>
    <button class="btn" id="speed">実況：ふつう</button>
    <button class="btn" id="skip">結果まで飛ばす</button>
    <button class="btn go" id="go">戦わせる</button>
  </div>
</div>
<dialog class="sheet" id="infoSheet"><button class="mini close" data-close>閉じる</button><div id="infoBody"></div></dialog>
<dialog class="sheet" id="featSheet" hidden><button class="mini close" data-close>閉じる</button><h3>舞台の特徴</h3>
  <p class="small" style="margin:0">押すと入れたり外したりできます。両者に効きます。</p>
  <div class="feats" id="feats" aria-label="舞台の特徴"></div>
  <p class="small" id="featText" style="margin:8px 0 0"></p>
</dialog>

<script>
window.IMAGES = {"chr_001":"../img/chr_001_base_1.webp","chr_002":"../img/chr_002_base_1.webp","chr_003":"../img/chr_003_base_1.webp","chr_004":"../img/chr_004_base_1.webp","chr_005":"../img/chr_005_base_1.webp","chr_006":"../img/chr_006_base_1.webp","chr_007":"../img/chr_007_base_1.webp","chr_008":"../img/chr_008_base_1.webp","chr_009":"../img/chr_009_base_1.webp","chr_010":"../img/chr_010_base_1.webp"};
// =====================================================================
// 対戦の仕組み（1対1）　js/battle.js
//   ・キャラの能力値（1〜120）、等級、覚悟、性質タグ、個体値から強さを決める
//   ・キャラごとの技と弱点は、下の FIGHTER_KITS に「部品」として書く
//   ・舞台の特徴（STAGE_FEATURES）は、性質タグを見て両者に効く
//   ・1戦はおおよそ30〜50ラウンド。60ラウンドで決着しなければ残り体力で判定
//   ・同じ種（seed）なら同じ結果になる
// =====================================================================

const BATTLE_RULES = {
  MAX_ROUNDS: 60,
  BASE_HP: 560,          // 体力 ＝ (BASE_HP + 持久力 × HP_PER_STA) × 等級の倍率
  HP_PER_STA: 6,
  BASE_DMG: 17,          // 1回の攻撃の基本ダメージ
  STAT_FLOOR: 35,        // 能力値の差を縮めるための下駄（実効値 ＝ 35 ＋ 0.65 × 能力値）
  STAT_SLOPE: 0.65
};

const GRADE_INFO = {
  F: { name: '微神級', mult: 0.84 }, E: { name: '小神級', mult: 0.88 }, D: { name: '常神級', mult: 0.92 },
  C: { name: '強神級', mult: 0.96 }, B: { name: '大神級', mult: 1.0 }, A: { name: '超神級', mult: 1.05 },
  S: { name: '神話級', mult: 1.1 }, ORIGIN: { name: '特殊等級', mult: 1.0 }
};
const GRADE_ORDER = ['F', 'E', 'D', 'C', 'B', 'A', 'S'];
const RESOLVE_INFO = { low: { name: '低い', mental: 1.0 }, mid: { name: 'ふつう', mental: 0.6 }, high: { name: '高い', mental: 0.3 } };

// ---------------------------------------------------------------------
// 舞台の特徴（両者に効く。性質タグや部品の uses を見て効果が変わる）
// ---------------------------------------------------------------------
const STAGE_FEATURES = {
  岩場:     { text: '岩を使う能力が強くなる' },
  夜空:     { text: '観測がたまりやすい' },
  反響:     { text: '音の攻撃が強くなる' },
  静寂:     { text: '音の攻撃が弱くなる' },
  騒音:     { text: '音の攻撃が乱れやすい' },
  寒冷:     { text: '風邪の効きが強くなり、素早さが少し下がる' },
  強風:     { text: '飛び道具が逸れやすく、帆走や飛行が強くなる' },
  無風:     { text: '帆走や風を使う能力が弱くなる' },
  狭所:     { text: '距離を取りにくく、近接型が有利' },
  開けた場所: { text: '距離を取りやすく、遠距離型が有利' },
  戦場:     { text: '戦いが激しくなりやすい' },
  安らぎ:   { text: '怒りや興奮による強化が弱まる' },
  小動物:   { text: 'かわいいものに弱いキャラが気を取られる' },
  生命の気配: { text: '精神に作用する能力が強くなる' },
  祭壇:     { text: '領域を作る能力が安定しやすい' },
  歓声:     { text: '先に攻撃を当てた方が少し強くなる。自信で強くなる能力も安定する' },
  異界:     { text: '3ラウンドごとに、両者の強化と弱体化が一度消える' }
};

// ---------------------------------------------------------------------
// 乱数
// ---------------------------------------------------------------------
function battleRng(seed) {
  let a = seed >>> 0;
  const r = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.range = (lo, hi) => lo + r() * (hi - lo);
  return r;
}

// 個体値は「桁」で少しだけ効く（中央値160で1.0、10倍で約1.08、1000倍で約1.24、上限1.4）
const individualFactor = v => Math.max(0.9, Math.min(1.4, 1 + 0.08 * Math.log10(Math.max(1, v || 160) / 160)));
const effStat = v => BATTLE_RULES.STAT_FLOOR + BATTLE_RULES.STAT_SLOPE * v;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---------------------------------------------------------------------
// 戦う者の状態
// ---------------------------------------------------------------------
function makeFighter(ch, ind, side, stage) {
  const kit = FIGHTER_KITS[ch.id];
  if (!kit) throw new Error(`${ch.id} の部品がありません`);
  const g = GRADE_INFO[ch.grade] || GRADE_INFO.B;
  const i = ind || {};
  const maxHp = Math.round((BATTLE_RULES.BASE_HP + ch.stats.sta * BATTLE_RULES.HP_PER_STA) * g.mult);
  const f = {
    side, ch, kit, name: kit.short || ch.name, grade: ch.grade, gradeMult: g.mult,
    tags: new Set(ch.tags || []), uses: new Set(kit.uses || []),
    resolve: ch.resolve || 'mid',
    base: {
      atk: effStat(ch.stats.atk) * g.mult * individualFactor(i.power),
      def: effStat(ch.stats.def) * g.mult,
      wis: effStat(ch.stats.wis) * individualFactor(i.wisdom),
      spd: effStat(ch.stats.spd) * individualFactor(i.speed),
      amb: ch.stats.amb
    },
    maxHp, hp: maxHp,
    mods: [],            // 一時的な強化・弱体化 { key, stat, mul, add, turns, tag, name }
    stun: 0, bind: 0, shield: 0, stored: 0,
    mentalRes: 1,        // 精神攻撃の受けやすさ（覚悟とキャラの特性で決まる）
    meters: {},          // キャラごとのゲージ（激しさ、分析、自信など）
    flags: {},           // 1回だけの技の使用済みなど
    dmgDealt: 0, dmgTaken: 0, hitsLanded: 0, forfeit: false, ambUsed: false,
    rec: { stunned: 0, bound: false, boundRounds: 0, debuffs: 0, spdDown: 0, evaded: 0, shieldBroken: 0, minHp: 1, hpAtR5: 1, takenByR8: 0 }   // 挑戦目標の判定用の記録
  };
  f.mentalRes = RESOLVE_INFO[f.resolve].mental * (kit.mentalRes ?? 1);
  kit.init?.(f);        // ゲージの準備（舞台の「敵の状態」より前に行う）
  return f;
}

// 舞台の特徴のうち、戦いの最初に決まるもの（性質タグを見て、両者に効く）
function applyStageFeatures(stage, fighters) {
  const has = n => stage.features.includes(n);
  for (const f of fighters) {
    const add = (stat, mul, key) => addMod(f, { key: 'stage_' + key, stat, mul, turns: 999, permanent: true });
    if (has('寒冷')) add('spd', 0.95, 'cold');
    if (has('強風')) { if (f.uses.has('wind')) f.flags.strongWind = true; if (f.tags.has('飛行')) add('spd', 1.05, 'wind'); }
    if (has('無風') && f.uses.has('wind')) f.flags.noWind = true;
    if (has('安らぎ') && f.tags.has('高揚')) add('atk', 0.9, 'calm');
    if (has('騒音') && f.uses.has('sound')) add('atk', 0.92, 'noise');
    if (has('祭壇') && f.tags.has('領域')) add('def', 1.05, 'altar');
    if (has('歓声') && f.tags.has('自信')) add('atk', 1.04, 'cheer');
  }
}

function statOf(f, stat) {
  let v = f.base[stat];
  let mul = 1;
  for (const m of f.mods) if (m.stat === stat) mul *= m.mul ?? 1;
  if (f.kit.statMul) mul *= f.kit.statMul(f, stat) ?? 1;
  return v * mul;
}
function addMod(f, m) {
  if (m.key) f.mods = f.mods.filter(x => x.key !== m.key);
  if (f.rec && m.mul < 1 && !m.permanent && !String(m.key || '').startsWith('stage_')) { f.rec.debuffs++; if (m.stat === 'spd') f.rec.spdDown++; }
  f.mods.push({ turns: 99, ...m });
}
function hasFeature(ctx, name) { return ctx.stage.features.includes(name); }

// ---------------------------------------------------------------------
// 1戦
// ---------------------------------------------------------------------
function runBattle(opts) {
  const r = battleRng(opts.seed ?? Math.floor(Math.random() * 1e9));
  const stage = { name: '無名の荒野', features: [], events: [], ...opts.stage };
  const A = makeFighter(opts.a.ch, opts.a.ind, 0, stage);
  const B = makeFighter(opts.b.ch, opts.b.ind, 1, stage);
  applyStageFeatures(stage, [A, B]);
  // その日の調子：戦うたびに攻撃と防御が少し上下する（番狂わせの源）
  for (const f of [A, B]) {
    f.form = r.range(0.82, 1.18);   // 与えるダメージに直接掛かる
  }
  const log = [];
  const ctx = {
    r, stage, A, B, round: 0, log, firstHit: null,
    foe: f => (f === A ? B : A),
    say(kind, text, extra = {}) { log.push({ round: ctx.round, kind, text, hpA: Math.max(0, Math.round(A.hp)), hpB: Math.max(0, Math.round(B.hp)), ...extra }); },
    line(f, key) { const arr = f.kit.lines[key]; return arr ? r.pick(arr) : ''; },
    feat: name => hasFeature(ctx, name),
    // 精神攻撃：受ける側の精神耐性・舞台で強さが変わる
    mental(src, tgt, power) {
      let p = power * tgt.mentalRes;
      if (ctx.feat('生命の気配')) p *= 1.35;
      if (tgt.kit.onMental) p = tgt.kit.onMental(ctx, tgt, src, p) ?? p;
      return p;
    },
    // 回避を打ち消す効果が、相手に掛かっているか
    evasionNegated: f => f.mods.some(m => m.negateEvasion) || f.bind > 0,
    damage(src, tgt, amount, info = {}) { return applyDamage(ctx, src, tgt, amount, info); },
    attack(src, tgt, opt) { return doAttack(ctx, src, tgt, opt); }
  };
  stage.setup?.(ctx);

  ctx.say('stage', `舞台：${stage.name}${stage.features.length ? `（${stage.features.join('・')}）` : ''}`);
  for (const f of [A, B]) {
    if (f.form >= 1.1) ctx.say('info', `${f.name}は絶好調だ`, { side: f.side });
    else if (f.form <= 0.9) ctx.say('info', `${f.name}は少し調子が悪そうだ`, { side: f.side });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'intro')}」`, { side: f.side });
    if (f.resolve === 'high' && ctx.foe(f).tags.has('精神干渉')) ctx.say('info', `${f.name}は、死も敗北も理解したうえで戦いに臨んでいる`, { side: f.side });
  }
  stage.enemyState?.(ctx, B, A);
  for (const f of [A, B]) f.kit.onStart?.(ctx, f, ctx.foe(f));

  while (A.hp > 0 && B.hp > 0 && ctx.round < BATTLE_RULES.MAX_ROUNDS && !A.forfeit && !B.forfeit) {
    ctx.round++;
    ctx.say('round', `ラウンド ${ctx.round}`);
    roundStart(ctx);
    // 行動順：素早さ＋ゆらぎ
    const order = [A, B].sort((x, y) => (statOf(y, 'spd') * r.range(0.85, 1.15) + (y.kit.initiative?.(ctx, y) || 0)) - (statOf(x, 'spd') * r.range(0.85, 1.15) + (x.kit.initiative?.(ctx, x) || 0)));
    for (const f of order) {
      if (A.hp <= 0 || B.hp <= 0 || A.forfeit || B.forfeit) break;
      act(ctx, f);
      // 素早さの差が大きいと、たまにもう一度動く
      const foe = ctx.foe(f);
      const extra = clamp((statOf(f, 'spd') - statOf(foe, 'spd')) / 220, 0, 0.3);
      if (extra > 0 && r.chance(extra) && f.hp > 0 && foe.hp > 0 && !f.forfeit && !foe.forfeit) act(ctx, f, true);
    }
    roundEnd(ctx);
  }
  return finish(ctx);
}

function roundStart(ctx) {
  const { A, B } = ctx;
  if (ctx.feat('異界') && ctx.round % 3 === 0) {
    for (const f of [A, B]) f.mods = f.mods.filter(m => m.permanent);
    ctx.say('event', '異界の揺らぎで、両者の強化と弱体化が消えた');
  }
  for (const ev of ctx.stage.events || []) {
    if ((ev.at && ev.at === ctx.round) || (ev.every && ctx.round % ev.every === 0)) ev.run(ctx);
  }
  for (const f of [A, B]) f.kit.onRound?.(ctx, f, ctx.foe(f));
}

function roundEnd(ctx) {
  for (const f of [ctx.A, ctx.B]) {
    f.kit.onRoundEnd?.(ctx, f, ctx.foe(f));
    for (const m of f.mods) m.turns--;
    const expired = f.mods.filter(m => m.turns <= 0 && m.onExpire);
    f.mods = f.mods.filter(m => m.turns > 0);
    expired.forEach(m => m.onExpire(ctx, f));
    if (f.bind > 0) { f.rec.bound = true; f.rec.boundRounds++; f.bind--; }
    f.rec.minHp = Math.min(f.rec.minHp, Math.max(0, f.hp) / f.maxHp);
    if (ctx.round === 5) f.rec.hpAtR5 = Math.max(0, f.hp) / f.maxHp;
    if (ctx.round === 8) f.rec.takenByR8 = f.dmgTaken / f.maxHp;
  }
}

function act(ctx, f, extra = false) {
  const foe = ctx.foe(f);
  if (f.stun > 0) {
    f.stun--; f.rec.stunned++;
    if (f.kit.onStunned?.(ctx, f, foe)) return;
    ctx.say('info', `${f.name}は動けない`, { side: f.side });
    return;
  }
  // 野望力の底力（体力3割以下で一度だけ）
  if (!f.ambUsed && f.hp <= f.maxHp * 0.3) {
    f.ambUsed = true;
    addMod(f, { key: 'amb', stat: 'atk', mul: 1 + f.base.amb / 600, turns: 99, permanent: true });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'low')}」`, { side: f.side, note: '野望力で攻撃が上がった' });
  }
  const action = f.kit.chooseAction?.(ctx, f, foe, extra) || { name: ctx.line(f, 'attack') };
  if (action.skip) { if (action.text) ctx.say('info', action.text, { side: f.side }); return; }
  if (action.special) { action.special(ctx, f, foe); return; }
  doAttack(ctx, f, foe, action);
}

// 攻撃：{ name, mult, hits, sure, pierce, big, label, after }
function doAttack(ctx, f, foe, opt = {}) {
  const { r } = ctx;
  const hits = opt.hits || 1;
  let total = 0, landed = 0;
  for (let h = 0; h < hits; h++) {
    if (foe.hp <= 0) break;
    // 命中
    let acc = 0.9 + (statOf(f, 'wis') - statOf(foe, 'spd')) * 0.0015;
    let eva = clamp(0.05 + (statOf(foe, 'spd') - statOf(f, 'spd')) * 0.0025, 0, 0.3);
    if (f.kit.accuracy) acc += f.kit.accuracy(ctx, f, foe) || 0;
    if (foe.kit.evasion) eva += foe.kit.evasion(ctx, foe, f, opt) || 0;
    if (ctx.feat('強風') && f.tags.has('遠距離')) acc -= 0.06;
    if (ctx.evasionNegated(foe) || opt.sure) eva = 0;
    const hitChance = opt.sure ? 1 : clamp(acc - eva, 0.4, 0.98);
    if (!r.chance(hitChance)) {
      foe.rec.evaded++;
      if (h === 0) ctx.say('miss', `${f.name}の${opt.name || '攻撃'}――${foe.name}はかわした`, { side: f.side });
      continue;
    }
    // ダメージ
    let dmg = BATTLE_RULES.BASE_DMG * (opt.mult ?? 1) / (hits > 1 ? Math.sqrt(hits) * 0.9 : 1);
    const atk = statOf(f, 'atk');
    let def = statOf(foe, 'def') * (1 - (opt.pierce || 0));
    dmg *= Math.pow(atk / def, 0.42);
    dmg *= r.range(0.7, 1.3);
    const critRate = 0.05 + statOf(f, 'wis') * 0.0008 + (f.kit.critBonus?.(ctx, f, foe) || 0);
    const crit = r.chance(critRate);
    if (crit) dmg *= 1.8;
    // 舞台
    if (ctx.feat('狭所')) { if (f.tags.has('近接')) dmg *= 1.08; if (f.tags.has('遠距離')) dmg *= 0.93; }
    if (ctx.feat('開けた場所')) { if (f.tags.has('遠距離')) dmg *= 1.08; if (f.tags.has('近接')) dmg *= 0.95; }
    if (f.uses.has('sound')) { if (ctx.feat('反響')) dmg *= 1.15; if (ctx.feat('静寂')) dmg *= 0.85; }
    if (f.uses.has('rock') && ctx.feat('岩場')) dmg *= 1.15;
    if (ctx.feat('歓声') && ctx.firstHit === f) dmg *= 1.05;
    if (f.kit.damageOut) dmg = f.kit.damageOut(ctx, f, foe, dmg, opt) ?? dmg;
    dmg *= ((typeof KIT_TUNE !== 'undefined' && KIT_TUNE[f.ch.id]) || 1) * (f.form || 1);
    if (f.side === 1 && ctx.stage.enemyPower) dmg *= ctx.stage.enemyPower;   // ステージごとの敵の強さ
    const res = applyDamage(ctx, f, foe, dmg, { crit, big: opt.big, name: opt.name });
    total += res; landed++;
    if (!ctx.firstHit) ctx.firstHit = f;
  }
  if (landed > 0) {
    f.hitsLanded++;
    const hitsText = hits > 1 ? `（${landed}回命中）` : '';
    ctx.say(opt.big ? 'big' : 'hit', `${opt.label ? opt.label + ' ' : ''}${f.name}は${opt.name || ctx.line(f, 'attack')}。${foe.name}に${Math.round(total)}ダメージ${hitsText}`, { side: f.side, dmg: Math.round(total) });
    opt.after?.(ctx, f, foe, total);
    f.kit.onHit?.(ctx, f, foe, total, opt);
  }
  return total;
}

function applyDamage(ctx, src, tgt, amount, info = {}) {
  let dmg = amount;
  if (tgt.kit.damageIn) dmg = tgt.kit.damageIn(ctx, tgt, src, dmg, info) ?? dmg;
  if (tgt.shield > 0 && !info.ignoreShield) {
    const absorbed = Math.min(tgt.shield, dmg);
    tgt.shield -= absorbed; dmg -= absorbed;
    if (tgt.shield <= 0 && dmg > 0) tgt.rec.shieldBroken++;
  }
  dmg = Math.max(0, dmg);
  tgt.hp -= dmg; tgt.dmgTaken += dmg;
  if (src) src.dmgDealt += dmg;
  tgt.kit.onDamaged?.(ctx, tgt, src, dmg, info);
  if (tgt.hp <= 0) tgt.kit.onFall?.(ctx, tgt, src);
  return dmg;
}

function finish(ctx) {
  const { A, B } = ctx;
  let winner = null, reason = '';
  if (A.forfeit || B.forfeit) { winner = A.forfeit ? B : A; reason = `${(A.forfeit ? A : B).name}が戦いをやめた`; }
  else if (A.hp > 0 && B.hp <= 0) { winner = A; reason = `${B.name}が倒れた`; }
  else if (B.hp > 0 && A.hp <= 0) { winner = B; reason = `${A.name}が倒れた`; }
  else if (A.hp <= 0 && B.hp <= 0) { reason = '相打ち'; }
  else {
    const ra = A.hp / A.maxHp, rb = B.hp / B.maxHp;
    winner = ra === rb ? null : (ra > rb ? A : B);
    reason = `${BATTLE_RULES.MAX_ROUNDS}ラウンドを戦い抜き、残り体力で判定`;
    ctx.say('info', reason);
  }
  if (winner) {
    const loser = ctx.foe(winner);
    ctx.say('talk', `${winner.name}「${ctx.line(winner, 'win')}」`, { side: winner.side });
    ctx.say('talk', `${loser.name}「${ctx.line(loser, 'lose')}」`, { side: loser.side });
  }
  const key = [...ctx.log].reverse().find(e => e.kind === 'skill' || e.kind === 'big');
  return {
    winner: winner ? winner.side : null, reason, rounds: ctx.round, log: ctx.log, stage: ctx.stage,
    A: { name: A.name, hp: Math.max(0, Math.round(A.hp)), maxHp: A.maxHp },
    B: { name: B.name, hp: Math.max(0, Math.round(B.hp)), maxHp: B.maxHp },
    key: key ? key.skill || key.text.slice(0, 24) : '地力の差',
    state: [A, B].map(f => ({ rec: f.rec, flags: f.flags, meters: f.meters, resolve: f.resolve, forfeit: f.forfeit, hp: f.hp, maxHp: f.maxHp }))
  };
}

// =====================================================================
// キャラごとの部品（技・弱点・台詞）
//   文章の技を、戦いの中の動きに置き換えたもの。
//   uses … 舞台の特徴が参照する性質（rock=岩を使う, sound=音で戦う, wind=風・帆を使う, irregular=動きが読めない）
// =====================================================================
const skill = (ctx, f, name, text, extra = {}) => ctx.say('skill', `${f.name}の「${name}」！ ${text}`, { side: f.side, skill: name, ...extra });
const gradeGap = (a, b) => GRADE_ORDER.indexOf(b.grade) - GRADE_ORDER.indexOf(a.grade);   // 相手が何段上か

const FIGHTER_KITS = {

  // ------------------------------------------------------------------ 001
  chr_001: {

    lines: {

      }
    },

        };

      if (!foe.bind && r.chance(foe.tags.has('遠距離') || statOf(foe, 'spd') > statOf(f, 'spd') ? 0.2 : 0.08)) {

  chr_002: {

    mentalRes: 0.4,     // 防御能力：精神攻撃への耐性が非常に高い

      }

      if (!f.flags.cry && ctx.round >= 3) { f.flags.cry = true; skill(ctx, f, '初泣領域', '呼吸音と心音が異常に強調され、隠れることも奇襲することもできなくなった'); }
      // 死への距離：瀕死の相手へ
      if (foe.hp < foe.maxHp * 0.25 && !foe.flags.deathDistance) {

        if (foe.resolve === 'low' && ctx.r.chance(0.35 * ctx.mental(f, foe, 1))) {

    chooseAction(ctx, f, foe) {

    onRound(ctx, f, foe) {
      let drain = 2.4;
      if (f.flags.fatigueExposed) drain *= 1.8;
      f.meters.energy = Math.max(0, f.meters.energy - drain);
      f.flags.early = ctx.round <= 6;   // 帆走加速：序盤は非常に強い
      // 懲練ワイヤー：時間とともに逃げ道が減る
      f.meters.wire = Math.min(30, f.meters.wire + 3);
      if (ctx.round === 4) skill(ctx, f, '懲練ワイヤー', '戦場に蜘蛛の巣のようなワイヤーが張り巡らされた');
      if (!f.flags.tired && f.meters.energy < 35) { f.flags.tired = true; ctx.say('info', `${f.name}の動きが目に見えて鈍くなってきた`, { side: f.side }); }
    },
    statMul(f, stat) {
      const e = f.meters.energy ?? 100;
      const sail = f.flags.noWind ? 0.85 : f.flags.strongWind ? 1.1 : 1;

      if (stat === 'spd') return (0.5 + 0.7 * e / 100) * sail;
      return 1;

    accuracy(ctx, f) { return 0.05; },
    chooseAction(ctx, f, foe) {
      const { r } = ctx;
      addMod(foe, { key: 'wire', stat: 'spd', mul: 1 - f.meters.wire / 100, turns: 99 });

      if (!f.flags.grad && f.meters.energy >= 35 && (ctx.round >= 7 || foe.hp < foe.maxHp * 0.6)) {
        f.flags.grad = true;

      low: ['我は神！　我は大悪魔！　我は最強！'],

    },
    init(f) { f.meters.conf = 100; },
    onStart(ctx, f, foe) {
      skill(ctx, f, '偽神魔界', '「我が魔界」が展開された。ここではデウマグナが神であり、大悪魔である');
    },
    onRound(ctx, f, foe) {
      let loss = 1.4 + Math.max(0, gradeGap(f, foe)) * 0.45;
      if (foe.resolve === 'low') loss *= 0.5;       // 相手が恐れるほど自信が安定する
      if (ctx.feat('祭壇')) loss *= 0.6;
      if (ctx.feat('歓声')) loss *= 0.8;
      if (f.flags.steady) loss *= 0.5;
      if (f.flags.smallAltar) loss *= 1.5;
      if (f.flags.hall) loss *= 0.8;
      f.meters.conf = Math.max(0, f.meters.conf - loss);
      if (ctx.round % 5 === 0 && f.meters.conf > 0) {
        f.meters.conf = Math.min(100, f.meters.conf + 6);
        ctx.say('talk', `${f.name}「${ctx.r.pick(['我こそ最強！', '我こそ神！', '我こそ大悪魔！'])}」`, { side: f.side, note: '自信が少し戻った' });
      }
      if (f.meters.conf <= 0 && !f.flags.broken) { f.flags.broken = true; ctx.say('big', `偽神魔界が崩れた。${f.name}はただの微神級に戻った`, { side: f.side }); }
      // 領域の力で傷を修復
      if (f.meters.conf > 50) f.hp = Math.min(f.maxHp, f.hp + f.maxHp * 0.012);
      // 神魔王モード
      if (!f.flags.king && f.meters.conf >= 85 && ctx.round >= 3) {
        f.flags.king = true;
        addMod(f, { key: 'king', stat: 'atk', mul: 1.5, turns: 3 });
        addMod(f, { key: 'king2', stat: 'def', mul: 1.3, turns: 3 });
        skill(ctx, f, '神魔王モード', '神でもあり、大悪魔でもある――と完全に信じ切った');
      }
    },
    statMul(f, stat) {
      const c = (f.meters.conf ?? 100) / 100;
      const godMode = f.hp < f.maxHp * 0.5;
      if (stat === 'atk') return (1 + 0.75 * c) * (godMode ? 1 : 1.1);
      if (stat === 'def') return (1 + 0.5 * c) * (godMode ? 1.12 : 1);
      return 1;
    },
    onMental(ctx, f, src, p) { f.meters.conf = Math.max(0, f.meters.conf - 30 * p); return p; },
    onHit(ctx, f) { f.meters.conf = Math.min(100, f.meters.conf + 2.5); },
    onDamaged(ctx, f, src, dmg, info) { if (info.big) f.meters.conf = Math.max(0, f.meters.conf - 12); },
    chooseAction(ctx, f, foe) {
      const { r } = ctx;
      // 切り札
      if (!f.flags.trump && (f.meters.conf < 30 || foe.hp < foe.maxHp * 0.35) && f.meters.conf > 5) {
        f.flags.trump = true;
        return { name: '偽・天地魔界崩壊', mult: 3.2, big: true, label: '神格と悪魔の力を拳に流し込み、全体重を乗せて――', after(ctx, f) { f.meters.conf = 0; } };
      }
      if (ctx.round % 6 === 1) return { special(ctx, f, foe) { addMod(foe, { key: 'quake', stat: 'spd', mul: 0.8, turns: 2 }); skill(ctx, f, '神魔震脚', `足場を揺らし、${foe.name}の動きを一瞬止めた`); } };

      return { name: ctx.line(f, 'attack') };
    }
  }
};

// 敵の強さ（与えるダメージの倍率）。tools/stage-sim.js --calibrate で難しさに合わせて調整する
const STAGE_POWER = {
  q001_1: 0.904,
  q001_2: 0.935,
  q001_3: 0.974,
  q002_1: 0.864,
  q002_2: 0.924,
  q002_3: 0.904,
  q003_1: 0.793,
  q003_2: 0.722,
  q003_3: 0.9,
  q004_1: 0.985,
  q004_2: 1.184,
  q004_3: 1.078,
  q005_1: 1.038,
  q005_2: 0.914,
  q005_3: 1.019,
  q006_1: 0.864,
  q006_2: 0.826,
  q006_3: 0.867,
  q007_1: 0.772,
  q007_2: 0.887,
  q007_3: 0.874,
  q008_1: 0.857,
  q008_2: 0.945,
  q008_3: 1.046,
  q009_1: 0.97,
  q009_2: 0.985,
  q009_3: 0.935,
  q010_1: 1.042,
  q010_2: 0.956,
  q010_3: 1.286
};

const FEATURE_LIST = ["岩場", "夜空", "反響", "静寂", "騒音", "寒冷", "強風", "無風", "狭所", "開けた場所", "戦場", "安らぎ", "小動物", "生命の気配", "祭壇", "歓声", "異界"];
const PRESETS = [
  { name: '無名の荒野（特徴なし）', features: [] },
  { name: '古戦場', features: ['戦場', '開けた場所'] },
  { name: '岩場の谷', features: ['岩場', '狭所'] },
  { name: '冬の山寺', features: ['寒冷', '安らぎ'] },
  { name: '伝歌の大劇場', features: ['反響', '歓声'] },
  { name: '天球儀の内部', features: ['夜空', '開けた場所'] },
  { name: '荒海の卒業航路', features: ['強風', '狭所'] },
  { name: '万生の産声', features: ['反響', '生命の気配', '開けた場所'] },
  { name: '神魔の玉座', features: ['祭壇', '歓声'] },
  { name: '神々の遺跡', features: ['岩場', '夜空', '異界'] }
];
const GRADE_COLOR = { F:'#8A93A6', E:'#5E9A6C', D:'#4F86C6', C:'#C9A227', B:'#E07B39', A:'#D8364A', S:'#7B5CC4', ORIGIN:'#2A9D9A' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = n => Number(n).toLocaleString('ja-JP');
const byId = Object.fromEntries(BATTLE_CHARS.map(c => [c.id, c]));
const state = { quest: 0, cleared: {}, goals: {}, pick: ['chr_007', 'chr_001'], ind: [null, null], features: [], token: 0, fast: false, skip: false };
const rollOne = () => { const y = -Math.log10(1 - Math.random()); const d = (-1.4 + Math.sqrt(1.96 + 1.2 * y)) / 0.6; return Math.floor(100 * Math.pow(10, d)); };
const roll = i => { state.ind[i] = { power: rollOne(), speed: rollOne(), wisdom: rollOne() }; };


const ALL_Q = [...STAGES, ...FARM_STAGES.map(f => ({ ...f, farm: true, level: f.difficulty }))];
const qLabel = q => q.farm ? `周回・${q.difficulty}：${q.name}` : `No.${q.boss.slice(4)} ${FIGHTER_KITS[q.boss].short} 段階${q.level}：${q.name}`;
function curQ() { return ALL_Q[state.quest]; }
function enemyFor(q) {
  if (!q.farm) return q.boss;
  const pool = BATTLE_CHARS.filter(c => q.grades.includes(c.grade));
  return pool[Math.floor(Math.random() * pool.length)].id;
}
function setQuest(i) {
  state.quest = i; const q = curQ();
  state.pick[1] = enemyFor(q);
  state.ind[1] = { ...(q.farm ? q.enemyInd : ENEMY_IND[q.level]) };
  state.features = [...q.features];
  $('#featLine').textContent = `特徴：${q.features.join('・') || 'なし'}　／　${q.farm ? '報酬 ' + q.reward + 'コイン' : '目標：' + (q.goal ? q.goal.text : 'なし')}`;
  corner(0); corner(1); renderInfo();
}
function renderInfo() {
  const q = curQ();
  const rw = q.farm ? `1勝 ${q.reward}コイン（クールタイム ${q.cooldown >= 60 ? q.cooldown / 60 + '分' : q.cooldown + '秒'}）` : `初回 ${QUEST_REWARDS[q.level].first}／2回目以降 ${QUEST_REWARDS[q.level].repeat}／目標達成 +${QUEST_REWARDS[q.level].goal}`;
  $('#infoBody').innerHTML = `<div class="info"><h3>${esc(qLabel(q))}</h3><dl>
    <dt>舞台の特徴</dt><dd>${q.features.map(f => `<b>${esc(f)}</b>：${esc(STAGE_FEATURES[f].text)}`).join('<br>') || 'なし'}</dd>
    ${q.farm ? `<dt>敵</dt><dd>${q.grades.join('・')}級からランダム</dd>` : `<dt>敵の状態</dt><dd>${esc(q.enemyText)}</dd>`}
    <dt>出来事</dt><dd>${esc(q.eventText)}</dd>
    <dt>挑戦目標</dt><dd>${esc(q.goal ? q.goal.text : 'なし')}</dd>
    <dt>報酬</dt><dd>${esc(rw)}</dd>
    ${q.farm ? '' : `<dt>攻略のヒント</dt><dd>${esc(STAGE_HINTS[q.boss])}</dd>`}
  </dl></div>`;
}

function corner(i, hp, max) {
  const c = byId[state.pick[i]], ind = state.ind[i];
  const pct = hp == null ? 100 : Math.max(0, hp) / max * 100;
  const el = $('#c' + i);
  el.style.setProperty('--c', GRADE_COLOR[c.grade]);
  el.innerHTML = `<div class="art"><img src="${IMAGES[c.id]}" alt="${esc(c.name)}"></div>
    <select aria-label="${i ? '2体目' : '1体目'}">${BATTLE_CHARS.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="grade"><b>${c.grade}</b>${esc(GRADE_INFO[c.grade].name)}・覚悟${esc(RESOLVE_INFO[c.resolve].name)}</div>
    <div class="ind"><span>パ<b>${num(ind.power)}</b></span><span>速<b>${num(ind.speed)}</b></span><span>賢<b>${num(ind.wisdom)}</b></span></div>
    <div class="hpbar"><i class="${pct <= 30 ? 'low' : ''}" style="width:${pct}%"></i></div>
    <div class="hpnum">${hp == null ? '' : `HP ${Math.max(0, Math.round(hp))} / ${max}`}</div>`;
  if (i === 1) el.querySelector('select').disabled = true;
  el.querySelector('select').onchange = e => { state.pick[i] = e.target.value; roll(i); corner(i); };
}
function renderFeats() {
  $('#feats').innerHTML = FEATURE_LIST.map(f => `<button aria-pressed="${state.features.includes(f)}" data-f="${esc(f)}">${esc(f)}</button>`).join('');
  $('#featText').textContent = state.features.length ? state.features.map(f => `${f}：${STAGE_FEATURES[f].text}`).join('　') : 'いまは特徴なし';
  $('#featLine').textContent = state.features.length ? '特徴：' + state.features.join('・') : '特徴：なし';
  document.querySelectorAll('#feats button').forEach(b => b.onclick = () => {
    const f = b.dataset.f; state.features = state.features.includes(f) ? state.features.filter(x => x !== f) : [...state.features, f];
    $('#preset').value = ''; renderFeats();
  });
}
function evHtml(e, names) {
  let t = esc(e.text);
  names.forEach((n, i) => { t = t.split(esc(n)).join(`<b class="s${i}">${esc(n)}</b>`); });
  return `<p class="ev ${e.kind}">${t}${e.note ? `<span class="note">${esc(e.note)}</span>` : ''}</p>`;
}
// 普通の攻撃が続くラウンドは、まとめて表示する
function compress(log, names) {
  const out = []; let buf = [];
  const flush = () => {
    if (!buf.length) return;
    const rounds = [...new Set(buf.map(e => e.round))];
    if (rounds.length <= 1) { buf.forEach(e => out.push(e)); buf = []; return; }
    const d = [0, 0]; buf.forEach(e => { if (e.dmg && e.side != null) d[e.side] += e.dmg; });
    const last = buf[buf.length - 1];
    out.push({ kind: 'sum', round: last.round, text: `ラウンド${rounds[0]}〜${rounds[rounds.length - 1]}：打ち合いが続く（${names[0]}が${d[0]}、${names[1]}が${d[1]}ダメージ）`, hpA: last.hpA, hpB: last.hpB });
    buf = [];
  };
  for (const e of log) {
    if (e.kind === 'round') continue;
    if (e.kind === 'hit' || e.kind === 'miss') { buf.push(e); continue; }
    flush(); out.push(e);
  }
  flush();
  return out;
}
async function go() {
  const my = ++state.token;           // 途中で押されたら、前の実況をやめて新しく始める
  state.skip = false;
  const btn = $('#go'); btn.textContent = 'やり直す'; btn.classList.add('running');
  const feed = $('#feed'); feed.innerHTML = '';
  const q = curQ();
  if (q.farm) { state.pick[1] = enemyFor(q); corner(1); }
  const res = runBattle({ a: { ch: byId[state.pick[0]], ind: state.ind[0] }, b: { ch: byId[state.pick[1]], ind: state.ind[1] },
    stage: { name: q.name, features: [...q.features], events: q.events, enemyState: q.enemyState, enemyPower: q.farm ? (q.enemyPower || 1) : (STAGE_POWER[q.id] || 1) } });
  const names = [res.A.name, res.B.name];
  corner(0, res.A.maxHp, res.A.maxHp); corner(1, res.B.maxHp, res.B.maxHp);
  const wait = ms => new Promise(r => setTimeout(r, state.skip ? 0 : state.fast ? ms / 4 : ms));
  for (const e of compress(res.log, names)) {
    if (my !== state.token) return;
    feed.insertAdjacentHTML('beforeend', evHtml(e, names));
    if (e.hpA != null) { corner(0, e.hpA, res.A.maxHp); corner(1, e.hpB, res.B.maxHp); }
    if (!state.skip) { feed.scrollTop = feed.scrollHeight; await wait(e.kind === 'skill' || e.kind === 'big' ? 900 : e.kind === 'sum' ? 700 : 500); }
  }
  if (my !== state.token) return;
  corner(0, res.A.hp, res.A.maxHp); corner(1, res.B.hp, res.B.maxHp);
  const w = res.winner === null ? null : names[res.winner];
  const winMe = res.winner === 0;
  let goalHtml = '';
  if (q.goal && q.goal.check) { const ok = q.goal.check(res); goalHtml = `<div class="goalbox">挑戦目標：${esc(q.goal.text)}<br><b class="${ok ? 'ok' : 'ng'}">${ok ? '達成！' : '未達成'}</b></div>`; if (ok) state.goals[q.id] = true; }
  let reward = '';
  if (winMe) {
    if (q.farm) reward = `${q.reward}コイン獲得`;
    else { const R = QUEST_REWARDS[q.level]; const first = !state.cleared[q.id]; state.cleared[q.id] = true; reward = first ? `初回クリア！ ${R.first}コイン` : `${R.repeat}コイン`; }
  }
  feed.insertAdjacentHTML('beforeend', `<div class="result"><h2>${winMe ? 'クリア！' : '敗北…'}</h2><p>${w ? esc(w) + 'の勝ち' : '引き分け'}／${esc(res.reason)}／${res.rounds}ラウンド</p>${reward ? `<p><b>${esc(reward)}</b></p>` : ''}${goalHtml}</div>`);
  feed.scrollTop = feed.scrollHeight;
  btn.textContent = 'もう一度'; btn.classList.remove('running');
}
async function bulk() {
  const out = $('#bulkOut'); out.innerHTML = '<p class="small">計算中…</p>';
  await new Promise(r => setTimeout(r, 30));
  const ids = BATTLE_CHARS.map(c => c.id), N = 50, t = {}, tot = {};
  for (const a of ids) for (const b of ids) { if (a === b) continue; let w = 0;
    for (let i = 0; i < N; i++) { const ia = { power: rollOne(), speed: rollOne(), wisdom: rollOne() }, ib = { power: rollOne(), speed: rollOne(), wisdom: rollOne() };
      const r = runBattle({ a: { ch: byId[a], ind: ia }, b: { ch: byId[b], ind: ib }, stage: { name: '', features: [...state.features] } }); if (r.winner === 0) w++; else if (r.winner === null) w += 0.5; }
    t[a + b] = w / N; }
  const short = id => FIGHTER_KITS[id].short.replace('＝プレア', '');
  const pct = (a, b) => Math.round(((t[a + b]) + (1 - t[b + a])) / 2 * 100);
  ids.forEach(a => { tot[a] = Math.round(ids.filter(b => b !== a).reduce((s, b) => s + pct(a, b), 0) / (ids.length - 1)); });
  out.innerHTML = `<table class="wr"><tr><th></th>${ids.map(b => `<th>${esc(short(b).slice(0, 3))}</th>`).join('')}<th>全体</th></tr>` +
    ids.map(a => `<tr><td>${esc(short(a))}</td>${ids.map(b => a === b ? '<td>－</td>' : `<td>${pct(a, b)}</td>`).join('')}<td><b>${tot[a]}</b></td></tr>`).join('') + '</table>';
}
$('#quest').innerHTML = ALL_Q.map((q, i) => `<option value="${i}">${esc(qLabel(q))}</option>`).join('');
$('#quest').onchange = e => setQuest(+e.target.value);
$('#reroll').onclick = () => { roll(0); corner(0); };
$('#speed').onclick = e => { state.fast = !state.fast; e.target.textContent = state.fast ? '実況：はやい' : '実況：ふつう'; };
$('#skip').onclick = () => { state.skip = true; };
$('#go').onclick = go;
$('#openInfo').onclick = () => $('#infoSheet').showModal();
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog.sheet').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
roll(0); setQuest(0);
</script>
</body>
</html>
