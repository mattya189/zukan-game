<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>【参考】集団戦の試作（ゲームに組み込む前のもの）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#E3E8F1; --paper:#F7F9FC; --card:#FFFFFF; --ink:#1E2A4A; --soft:#4F5B7A; --line:#C4CEDD; --red:#D8364A; --blue:#2F6FD6; --gold:#C98F00; --green:#2FA36B;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace; --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141B2E; --paper:#1F2842; --card:#27314F; --ink:#EEF2FA; --soft:#B7C1DA; --line:#3A4670; } }
:root[data-theme="dark"] { --bg:#141B2E; --paper:#1F2842; --card:#27314F; --ink:#EEF2FA; --soft:#B7C1DA; --line:#3A4670; }
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after { box-sizing:inherit; }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--maru); font-weight:500; font-size:15px; line-height:1.7; -webkit-tap-highlight-color:transparent; }
button,select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.app { max-width:560px; margin:0 auto; padding:8px 10px 6px; height:100%; display:flex; flex-direction:column; gap:6px; }
@supports (height: 100dvh) { .app { height:100dvh; } }
.top { display:flex; align-items:center; justify-content:space-between; gap:6px; flex:none; }
h1 { font-family:var(--dot); font-weight:400; font-size:16px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini { border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:1px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
.field { flex:none; height:clamp(170px, 42dvh, 420px); display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; background:var(--paper); border-radius:12px; padding:4px; position:relative; }
.field::after { content:""; position:absolute; top:6px; bottom:6px; left:var(--mid, 50%); border-left:2px dashed var(--line); pointer-events:none; }
.col { display:flex; flex-direction:column; gap:4px; min-width:0; }
.col .cl { flex:none; text-align:center; font-size:10px; font-weight:900; letter-spacing:.05em; border-radius:6px; color:#fff; }
.col.me .cl { background:var(--blue); } .col.foe .cl { background:var(--red); }
.col .cells { flex:1; display:grid; grid-auto-rows:1fr; gap:4px; min-height:0; }
.col .cells.n3 { grid-template-columns:1fr 1fr; }
.col .cells.n3 .cell:last-child { grid-column:1 / -1; }
.cell { min-height:0; position:relative; background:var(--card); border-radius:9px; overflow:hidden; }
.cell.down { opacity:.35; filter:grayscale(1); }
.cell img { position:absolute; left:2px; right:2px; top:2px; bottom:22px; width:calc(100% - 4px); height:calc(100% - 24px); object-fit:contain; object-position:center bottom; }
.cell .cap { position:absolute; left:3px; right:3px; bottom:2px; }
.cell .nm { font-size:10px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; text-align:center; }
.col .empty { flex:1; border:1.5px dashed var(--line); border-radius:9px; }
.team { display:grid; grid-template-columns:auto 1fr; gap:6px; align-items:stretch; background:var(--paper); border-radius:12px; padding:5px 6px; border-left:5px solid var(--tc); }
.team .lab { writing-mode:vertical-rl; font-size:11px; font-weight:900; color:var(--tc); letter-spacing:.1em; text-align:center; }
.slots { display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:5px; }
.slot { background:var(--card); border-radius:10px; padding:3px 4px; min-width:0; display:flex; flex-direction:column; gap:2px; position:relative; }
.slot.down { opacity:.4; filter:grayscale(1); }
.slot .art { position:relative; height:clamp(56px, 13dvh, 120px); }
.slot .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center bottom; }
.slot .row { position:absolute; top:2px; left:2px; font-size:10px; font-weight:900; color:#fff; background:var(--ink); border-radius:6px; padding:0 5px; }
.slot .nm { font-size:11px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hpbar { height:7px; background:color-mix(in srgb, var(--soft) 25%, transparent); border-radius:99px; overflow:hidden; }
.hpbar i { display:block; height:100%; background:var(--green); transition:width .3s; }
.hpbar i.low { background:var(--red); }
.panel { flex:none; background:var(--paper); border-radius:12px; padding:6px 8px; }
.prow { display:flex; gap:6px; align-items:center; }
.prow select { flex:1; min-width:0; background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:5px; font-weight:700; font-size:13px; }
.small { font-size:12px; color:var(--soft); }
.feed { flex:1 1 auto; min-height:22dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--paper); border-radius:12px; padding:8px 10px; }
.feed:empty::before { content:"チームとステージを選んで「戦わせる」を押すと、実況が流れます。"; color:var(--soft); font-size:13px; }
.ev { margin:0 0 7px; font-size:16px; line-height:1.75; animation:in .2s; }
@keyframes in { from { opacity:0; transform:translateY(3px); } }
.ev.stage { font-weight:900; } .ev.talk { font-weight:700; }
.ev.skill { background:color-mix(in srgb, var(--gold) 16%, transparent); border-left:4px solid var(--gold); padding:4px 9px; border-radius:0 8px 8px 0; font-weight:700; }
.ev.big { background:color-mix(in srgb, var(--red) 14%, transparent); border-left:4px solid var(--red); padding:4px 9px; border-radius:0 8px 8px 0; font-weight:900; }
.ev.event { background:color-mix(in srgb, var(--blue) 12%, transparent); border-left:4px solid var(--blue); padding:4px 9px; border-radius:0 8px 8px 0; }
.ev.sum { color:var(--soft); font-size:14px; background:var(--card); border-radius:8px; padding:4px 9px; }
.ev.info, .ev.miss { color:var(--soft); }
.ev b.s0 { color:var(--blue); } .ev b.s1 { color:var(--red); }
.ev .note { display:block; font-size:12px; color:var(--soft); font-weight:500; }
.result { margin-top:8px; text-align:center; background:var(--ink); color:var(--paper); border-radius:12px; padding:12px; }
.result h2 { margin:0; font-family:var(--dot); font-weight:400; font-size:24px; }
.result p { margin:2px 0 0; font-size:13px; opacity:.9; }
.goalbox { margin-top:8px; font-size:14px; background:var(--card); color:var(--ink); border-radius:10px; padding:8px 10px; text-align:left; line-height:1.6; }
.goalbox b { display:inline-block; margin-top:2px; font-size:15px; } .goalbox b.ok { color:var(--green); } .goalbox b.ng { color:var(--red); }
.btns { flex:none; display:grid; grid-template-columns:1fr 1fr 1fr 1.4fr; gap:6px; }
.btn { border:2px solid var(--ink); background:var(--card); border-radius:12px; padding:8px 2px; font-weight:900; font-size:12px; white-space:nowrap; }
.btn.go { background:var(--red); border-color:var(--red); color:#fff; font-size:15px; }
.btn.go.running { background:var(--card); color:var(--red); }
dialog.sheet { border:0; border-radius:16px; padding:12px; width:min(540px, 94vw); max-height:86dvh; overflow:auto; background:var(--paper); color:var(--ink); }
dialog.sheet::backdrop { background:rgba(10,15,30,.55); }
dialog.sheet h3 { margin:0 0 6px; font-size:15px; }
.close { float:right; }
.pick { display:grid; grid-template-columns:1fr auto; gap:6px; margin:6px 0; }
.pick select { background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:6px; font-weight:700; }
.seg { display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:0; background:var(--card); padding:4px 10px; font-size:12px; font-weight:900; }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
.info dl { display:grid; grid-template-columns:5.5em 1fr; gap:4px 8px; margin:6px 0; font-size:14px; } .info dt { color:var(--soft); font-weight:700; font-size:12px; padding-top:2px; } .info dd { margin:0; }
.warn { color:var(--red); font-size:12px; font-weight:700; }
/* 実況を広く見る表示（戦っている間は自動でこの表示になる） */
.app.compact .field { height:clamp(150px, 32dvh, 320px); }
.app.compact .panel { display:none; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>マッチ神 集団戦（試作）</h1><div style="display:flex;gap:6px"><button class="mini" id="view">実況を広く</button><button class="mini" id="openInfo">詳細</button></div></div>
  <div class="field" id="field" aria-label="戦場（左が自分のチーム、右が相手のチーム）"></div>
  <div class="panel">
    <div class="prow"><select id="mode" aria-label="ステージ"></select><button class="mini" id="openTeam">編成</button></div>
    <p class="small" id="line" style="margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p>
  </div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="btns">
    <button class="btn" id="reroll">個体を引き直す</button>
    <button class="btn" id="speed">実況：ふつう</button>
    <button class="btn" id="skip">結果まで飛ばす</button>
    <button class="btn go" id="go">戦わせる</button>
  </div>
</div>
<dialog class="sheet" id="teamSheet"><button class="mini close" data-close>閉じる</button><h3>チーム編成</h3>
  <p class="small" style="margin:0">同じキャラは同じチームに入れられません。前衛は狙われやすく、後衛は前衛が立っている間は狙われにくい。近接型は前衛、遠距離型は後衛が得意です。</p>
  <div id="teamEdit"></div>
</dialog>
<dialog class="sheet" id="infoSheet"><button class="mini close" data-close>閉じる</button><div id="infoBody"></div></dialog>
<script>
window.IMAGES = {"chr_001":"../img/chr_001_base_1_s.webp","chr_002":"../img/chr_002_base_1_s.webp","chr_003":"../img/chr_003_base_1_s.webp","chr_004":"../img/chr_004_base_1_s.webp","chr_005":"../img/chr_005_base_1_s.webp","chr_006":"../img/chr_006_base_1_s.webp","chr_007":"../img/chr_007_base_1_s.webp","chr_008":"../img/chr_008_base_1_s.webp","chr_009":"../img/chr_009_base_1_s.webp","chr_010":"../img/chr_010_base_1_s.webp"};
// =====================================================================
// 対戦の仕組み（1対1）　js/battle.js
//   ・キャラの能力値（1〜120）、等級、覚悟、性質タグ、個体値から強さを決める
//   ・キャラごとの技と弱点は、下の FIGHTER_KITS に「部品」として書く
//   ・舞台の特徴（STAGE_FEATURES）は、性質タグを見て両者に効く
//   ・1戦はおおよそ30〜50ラウンド。60ラウンドで決着しなければ残り体力で判定
//   ・同じ種（seed）なら同じ結果になる
// =====================================================================

const BATTLE_RULES = {
  MAX_ROUNDS: 60,
  BASE_HP: 560,          // 体力 ＝ (BASE_HP + 持久力 × HP_PER_STA) × 等級の倍率
  HP_PER_STA: 6,
  BASE_DMG: 17,          // 1回の攻撃の基本ダメージ
  STAT_FLOOR: 35,        // 能力値の差を縮めるための下駄（実効値 ＝ 35 ＋ 0.65 × 能力値）
  STAT_SLOPE: 0.65
};

const GRADE_INFO = {
  F: { name: '微神級', mult: 0.84 }, E: { name: '小神級', mult: 0.88 }, D: { name: '常神級', mult: 0.92 },
  C: { name: '強神級', mult: 0.96 }, B: { name: '大神級', mult: 1.0 }, A: { name: '超神級', mult: 1.05 },
  S: { name: '神話級', mult: 1.1 }, ORIGIN: { name: '特殊等級', mult: 1.0 }
};
const GRADE_ORDER = ['F', 'E', 'D', 'C', 'B', 'A', 'S'];
const RESOLVE_INFO = { low: { name: '低い', mental: 1.0 }, mid: { name: 'ふつう', mental: 0.6 }, high: { name: '高い', mental: 0.3 } };

// ---------------------------------------------------------------------
// 舞台の特徴（両者に効く。性質タグや部品の uses を見て効果が変わる）
// ---------------------------------------------------------------------
const STAGE_FEATURES = {
  岩場:     { text: '岩を使う能力が強くなる' },
  夜空:     { text: '観測がたまりやすい' },
  反響:     { text: '音の攻撃が強くなる' },
  静寂:     { text: '音の攻撃が弱くなる' },
  騒音:     { text: '音の攻撃が乱れやすい' },
  寒冷:     { text: '風邪の効きが強くなり、素早さが少し下がる' },
  強風:     { text: '飛び道具が逸れやすく、帆走や飛行が強くなる' },
  無風:     { text: '帆走や風を使う能力が弱くなる' },
  狭所:     { text: '距離を取りにくく、近接型が有利' },
  開けた場所: { text: '距離を取りやすく、遠距離型が有利' },
  戦場:     { text: '戦いが激しくなりやすい' },
  安らぎ:   { text: '怒りや興奮による強化が弱まる' },
  小動物:   { text: 'かわいいものに弱いキャラが気を取られる' },
  生命の気配: { text: '精神に作用する能力が強くなる' },
  祭壇:     { text: '領域を作る能力が安定しやすい' },
  歓声:     { text: '先に攻撃を当てた方が少し強くなる。自信で強くなる能力も安定する' },
  異界:     { text: '3ラウンドごとに、両者の強化と弱体化が一度消える' }
};

// ---------------------------------------------------------------------
// 乱数
// ---------------------------------------------------------------------
function battleRng(seed) {
  let a = seed >>> 0;
  const r = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.range = (lo, hi) => lo + r() * (hi - lo);
  return r;
}

// 個体値は「桁」で少しだけ効く（中央値160で1.0、10倍で約1.08、1000倍で約1.24、上限1.4）
const individualFactor = v => Math.max(0.9, Math.min(1.4, 1 + 0.08 * Math.log10(Math.max(1, v || 160) / 160)));
const effStat = v => BATTLE_RULES.STAT_FLOOR + BATTLE_RULES.STAT_SLOPE * v;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---------------------------------------------------------------------
// 戦う者の状態
// ---------------------------------------------------------------------
function makeFighter(ch, ind, side, stage) {
  const kit = FIGHTER_KITS[ch.id];
  if (!kit) throw new Error(`${ch.id} の部品がありません`);
  const g = GRADE_INFO[ch.grade] || GRADE_INFO.B;
  const i = ind || {};
  const maxHp = Math.round((BATTLE_RULES.BASE_HP + ch.stats.sta * BATTLE_RULES.HP_PER_STA) * g.mult);
  const f = {
    side, ch, kit, name: kit.short || ch.name, grade: ch.grade, gradeMult: g.mult,
    tags: new Set(ch.tags || []), uses: new Set(kit.uses || []),
    resolve: ch.resolve || 'mid',
    base: {
      atk: effStat(ch.stats.atk) * g.mult * individualFactor(i.power),
      def: effStat(ch.stats.def) * g.mult,
      wis: effStat(ch.stats.wis) * individualFactor(i.wisdom),
      spd: effStat(ch.stats.spd) * individualFactor(i.speed),
      amb: ch.stats.amb
    },
    maxHp, hp: maxHp,
    mods: [],            // 一時的な強化・弱体化 { key, stat, mul, add, turns, tag, name }
    stun: 0, bind: 0, shield: 0, stored: 0,
    mentalRes: 1,        // 精神攻撃の受けやすさ（覚悟とキャラの特性で決まる）
    meters: {},          // キャラごとのゲージ（激しさ、分析、自信など）
    flags: {},           // 1回だけの技の使用済みなど
    dmgDealt: 0, dmgTaken: 0, hitsLanded: 0, forfeit: false, ambUsed: false,
    rec: { stunned: 0, bound: false, boundRounds: 0, debuffs: 0, spdDown: 0, evaded: 0, shieldBroken: 0, minHp: 1, hpAtR5: 1, takenByR8: 0 }   // 挑戦目標の判定用の記録
  };
  f.mentalRes = RESOLVE_INFO[f.resolve].mental * (kit.mentalRes ?? 1);
  kit.init?.(f);        // ゲージの準備（舞台の「敵の状態」より前に行う）
  return f;
}

// 舞台の特徴のうち、戦いの最初に決まるもの（性質タグを見て、両者に効く）
function applyStageFeatures(stage, fighters) {
  const has = n => stage.features.includes(n);
  for (const f of fighters) {
    const add = (stat, mul, key) => addMod(f, { key: 'stage_' + key, stat, mul, turns: 999, permanent: true });
    if (has('寒冷')) add('spd', 0.95, 'cold');
    if (has('強風')) { if (f.uses.has('wind')) f.flags.strongWind = true; if (f.tags.has('飛行')) add('spd', 1.05, 'wind'); }
    if (has('無風') && f.uses.has('wind')) f.flags.noWind = true;
    if (has('安らぎ') && f.tags.has('高揚')) add('atk', 0.9, 'calm');
    if (has('騒音') && f.uses.has('sound')) add('atk', 0.92, 'noise');
    if (has('祭壇') && f.tags.has('領域')) add('def', 1.05, 'altar');
    if (has('歓声') && f.tags.has('自信')) add('atk', 1.04, 'cheer');
  }
}

function statOf(f, stat) {
  let v = f.base[stat];
  let mul = 1;
  for (const m of f.mods) if (m.stat === stat) mul *= m.mul ?? 1;
  if (f.kit.statMul) mul *= f.kit.statMul(f, stat) ?? 1;
  return v * mul;
}
function addMod(f, m) {
  if (m.key) f.mods = f.mods.filter(x => x.key !== m.key);
  if (f.rec && m.mul < 1 && !m.permanent && !String(m.key || '').startsWith('stage_')) { f.rec.debuffs++; if (m.stat === 'spd') f.rec.spdDown++; }
  f.mods.push({ turns: 99, ...m });
}
function hasFeature(ctx, name) { return ctx.stage.features.includes(name); }

// ---------------------------------------------------------------------
// 1戦
// ---------------------------------------------------------------------
function runBattle(opts) {
  const r = battleRng(opts.seed ?? Math.floor(Math.random() * 1e9));
  const stage = { name: '無名の荒野', features: [], events: [], ...opts.stage };
  const A = makeFighter(opts.a.ch, opts.a.ind, 0, stage);
  const B = makeFighter(opts.b.ch, opts.b.ind, 1, stage);
  applyStageFeatures(stage, [A, B]);
  // その日の調子：戦うたびに攻撃と防御が少し上下する（番狂わせの源）
  for (const f of [A, B]) {
    f.form = r.range(0.82, 1.18);   // 与えるダメージに直接掛かる
  }
  const log = [];
  const ctx = {
    r, stage, A, B, round: 0, log, firstHit: null,
    foe: f => (f === A ? B : A),
    say(kind, text, extra = {}) { log.push({ round: ctx.round, kind, text, hpA: Math.max(0, Math.round(A.hp)), hpB: Math.max(0, Math.round(B.hp)), ...extra }); },
    line(f, key) { const arr = f.kit.lines[key]; return arr ? r.pick(arr) : ''; },
    feat: name => hasFeature(ctx, name),
    // 精神攻撃：受ける側の精神耐性・舞台で強さが変わる
    mental(src, tgt, power) {
      let p = power * tgt.mentalRes;
      if (ctx.feat('生命の気配')) p *= 1.35;
      if (tgt.kit.onMental) p = tgt.kit.onMental(ctx, tgt, src, p) ?? p;
      return p;
    },
    // 回避を打ち消す効果が、相手に掛かっているか
    evasionNegated: f => f.mods.some(m => m.negateEvasion) || f.bind > 0,
    damage(src, tgt, amount, info = {}) { return applyDamage(ctx, src, tgt, amount, info); },
    attack(src, tgt, opt) { return doAttack(ctx, src, tgt, opt); }
  };
  stage.setup?.(ctx);

  ctx.say('stage', `舞台：${stage.name}${stage.features.length ? `（${stage.features.join('・')}）` : ''}`);
  for (const f of [A, B]) {
    if (f.form >= 1.1) ctx.say('info', `${f.name}は絶好調だ`, { side: f.side });
    else if (f.form <= 0.9) ctx.say('info', `${f.name}は少し調子が悪そうだ`, { side: f.side });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'intro')}」`, { side: f.side });
    if (f.resolve === 'high' && ctx.foe(f).tags.has('精神干渉')) ctx.say('info', `${f.name}は、死も敗北も理解したうえで戦いに臨んでいる`, { side: f.side });
  }
  stage.enemyState?.(ctx, B, A);
  for (const f of [A, B]) f.kit.onStart?.(ctx, f, ctx.foe(f));

  while (A.hp > 0 && B.hp > 0 && ctx.round < BATTLE_RULES.MAX_ROUNDS && !A.forfeit && !B.forfeit) {
    ctx.round++;
    ctx.say('round', `ラウンド ${ctx.round}`);
    roundStart(ctx);
    // 行動順：素早さ＋ゆらぎ
    const order = [A, B].sort((x, y) => (statOf(y, 'spd') * r.range(0.85, 1.15) + (y.kit.initiative?.(ctx, y) || 0)) - (statOf(x, 'spd') * r.range(0.85, 1.15) + (x.kit.initiative?.(ctx, x) || 0)));
    for (const f of order) {
      if (A.hp <= 0 || B.hp <= 0 || A.forfeit || B.forfeit) break;
      act(ctx, f);
      // 素早さの差が大きいと、たまにもう一度動く
      const foe = ctx.foe(f);
      const extra = clamp((statOf(f, 'spd') - statOf(foe, 'spd')) / 220, 0, 0.3);
      if (extra > 0 && r.chance(extra) && f.hp > 0 && foe.hp > 0 && !f.forfeit && !foe.forfeit) act(ctx, f, true);
    }
    roundEnd(ctx);
  }
  return finish(ctx);
}

function roundStart(ctx) {
  const { A, B } = ctx;
  if (ctx.feat('異界') && ctx.round % 3 === 0) {
    for (const f of [A, B]) f.mods = f.mods.filter(m => m.permanent);
    ctx.say('event', '異界の揺らぎで、両者の強化と弱体化が消えた');
  }
  for (const ev of ctx.stage.events || []) {
    if ((ev.at && ev.at === ctx.round) || (ev.every && ctx.round % ev.every === 0)) ev.run(ctx);
  }
  for (const f of [A, B]) f.kit.onRound?.(ctx, f, ctx.foe(f));
}

function roundEnd(ctx) {
  for (const f of [ctx.A, ctx.B]) {
    f.kit.onRoundEnd?.(ctx, f, ctx.foe(f));
    for (const m of f.mods) m.turns--;
    const expired = f.mods.filter(m => m.turns <= 0 && m.onExpire);
    f.mods = f.mods.filter(m => m.turns > 0);
    expired.forEach(m => m.onExpire(ctx, f));
    if (f.bind > 0) { f.rec.bound = true; f.rec.boundRounds++; f.bind--; }
    f.rec.minHp = Math.min(f.rec.minHp, Math.max(0, f.hp) / f.maxHp);
    if (ctx.round === 5) f.rec.hpAtR5 = Math.max(0, f.hp) / f.maxHp;
    if (ctx.round === 8) f.rec.takenByR8 = f.dmgTaken / f.maxHp;
  }
}

function act(ctx, f, extra = false) {
  const foe = ctx.foe(f);
  if (f.stun > 0) {
    f.stun--; f.rec.stunned++;
    if (f.kit.onStunned?.(ctx, f, foe)) return;
    ctx.say('info', `${f.name}は動けない`, { side: f.side });
    return;
  }
  // 野望力の底力（体力3割以下で一度だけ）
  if (!f.ambUsed && f.hp <= f.maxHp * 0.3) {
    f.ambUsed = true;
    addMod(f, { key: 'amb', stat: 'atk', mul: 1 + f.base.amb / 600, turns: 99, permanent: true });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'low')}」`, { side: f.side, note: '野望力で攻撃が上がった' });
  }
  const action = f.kit.chooseAction?.(ctx, f, foe, extra) || { name: ctx.line(f, 'attack') };
  if (action.skip) { if (action.text) ctx.say('info', action.text, { side: f.side }); return; }
  if (action.special) { action.special(ctx, f, foe); return; }
  doAttack(ctx, f, foe, action);
}

// 攻撃：{ name, mult, hits, sure, pierce, big, label, after }
function doAttack(ctx, f, foe, opt = {}) {
  const { r } = ctx;
  const hits = opt.hits || 1;
  let total = 0, landed = 0;
  for (let h = 0; h < hits; h++) {
    if (foe.hp <= 0) break;
    // 命中
    let acc = 0.9 + (statOf(f, 'wis') - statOf(foe, 'spd')) * 0.0015;
    let eva = clamp(0.05 + (statOf(foe, 'spd') - statOf(f, 'spd')) * 0.0025, 0, 0.3);
    if (f.kit.accuracy) acc += f.kit.accuracy(ctx, f, foe) || 0;
    if (foe.kit.evasion) eva += foe.kit.evasion(ctx, foe, f, opt) || 0;
    if (ctx.feat('強風') && f.tags.has('遠距離')) acc -= 0.06;
    if (ctx.evasionNegated(foe) || opt.sure) eva = 0;
    const hitChance = opt.sure ? 1 : clamp(acc - eva, 0.4, 0.98);
    if (!r.chance(hitChance)) {
      foe.rec.evaded++;
      if (h === 0) ctx.say('miss', `${f.name}の${opt.name || '攻撃'}――${foe.name}はかわした`, { side: f.side });
      continue;
    }
    // ダメージ
    let dmg = BATTLE_RULES.BASE_DMG * (opt.mult ?? 1) / (hits > 1 ? Math.sqrt(hits) * 0.9 : 1);
    const atk = statOf(f, 'atk');
    let def = statOf(foe, 'def') * (1 - (opt.pierce || 0));
    dmg *= Math.pow(atk / def, 0.42);
    dmg *= r.range(0.7, 1.3);
    const critRate = 0.05 + statOf(f, 'wis') * 0.0008 + (f.kit.critBonus?.(ctx, f, foe) || 0);
    const crit = r.chance(critRate);
    if (crit) dmg *= 1.8;
    // 舞台
    if (ctx.feat('狭所')) { if (f.tags.has('近接')) dmg *= 1.08; if (f.tags.has('遠距離')) dmg *= 0.93; }
    if (ctx.feat('開けた場所')) { if (f.tags.has('遠距離')) dmg *= 1.08; if (f.tags.has('近接')) dmg *= 0.95; }
    if (f.uses.has('sound')) { if (ctx.feat('反響')) dmg *= 1.15; if (ctx.feat('静寂')) dmg *= 0.85; }
    if (f.uses.has('rock') && ctx.feat('岩場')) dmg *= 1.15;
    if (ctx.feat('歓声') && ctx.firstHit === f) dmg *= 1.05;
    if (ctx.rowMul) dmg *= ctx.rowMul(f, foe, opt);   // 集団戦：並び（前衛・後衛）の効果
    if (f.kit.damageOut) dmg = f.kit.damageOut(ctx, f, foe, dmg, opt) ?? dmg;
    dmg *= ((typeof KIT_TUNE !== 'undefined' && KIT_TUNE[f.ch.id]) || 1) * (f.form || 1);
    if (f.side === 1 && ctx.stage.enemyPower) dmg *= ctx.stage.enemyPower;   // ステージごとの敵の強さ
    const res = applyDamage(ctx, f, foe, dmg, { crit, big: opt.big, name: opt.name });
    total += res; landed++;
    if (!ctx.firstHit) ctx.firstHit = f;
  }
  if (landed > 0) {
    f.hitsLanded++;
    const hitsText = hits > 1 ? `（${landed}回命中）` : '';
    ctx.say(opt.big ? 'big' : 'hit', `${opt.label ? opt.label + ' ' : ''}${f.name}は${opt.name || ctx.line(f, 'attack')}。${foe.name}に${Math.round(total)}ダメージ${hitsText}`, { side: f.side, dmg: Math.round(total) });
    opt.after?.(ctx, f, foe, total);
    f.kit.onHit?.(ctx, f, foe, total, opt);
  }
  return total;
}

function applyDamage(ctx, src, tgt, amount, info = {}) {
  let dmg = amount;
  if (ctx.beforeDamage) dmg = ctx.beforeDamage(src, tgt, dmg, info);   // 集団戦：味方をかばう効果など
  if (tgt.kit.damageIn) dmg = tgt.kit.damageIn(ctx, tgt, src, dmg, info) ?? dmg;
  if (tgt.shield > 0 && !info.ignoreShield) {
    const absorbed = Math.min(tgt.shield, dmg);
    tgt.shield -= absorbed; dmg -= absorbed;
    if (tgt.shield <= 0 && dmg > 0) tgt.rec.shieldBroken++;
  }
  dmg = Math.max(0, dmg);
  tgt.hp -= dmg; tgt.dmgTaken += dmg;
  if (src) src.dmgDealt += dmg;
  tgt.kit.onDamaged?.(ctx, tgt, src, dmg, info);
  if (tgt.hp <= 0) tgt.kit.onFall?.(ctx, tgt, src);
  return dmg;
}

function finish(ctx) {
  const { A, B } = ctx;
  let winner = null, reason = '';
  if (A.forfeit || B.forfeit) { winner = A.forfeit ? B : A; reason = `${(A.forfeit ? A : B).name}が戦いをやめた`; }
  else if (A.hp > 0 && B.hp <= 0) { winner = A; reason = `${B.name}が倒れた`; }
  else if (B.hp > 0 && A.hp <= 0) { winner = B; reason = `${A.name}が倒れた`; }
  else if (A.hp <= 0 && B.hp <= 0) { reason = '相打ち'; }
  else {
    const ra = A.hp / A.maxHp, rb = B.hp / B.maxHp;
    winner = ra === rb ? null : (ra > rb ? A : B);
    reason = `${BATTLE_RULES.MAX_ROUNDS}ラウンドを戦い抜き、残り体力で判定`;
    ctx.say('info', reason);
  }
  if (winner) {
    const loser = ctx.foe(winner);
    ctx.say('talk', `${winner.name}「${ctx.line(winner, 'win')}」`, { side: winner.side });
    ctx.say('talk', `${loser.name}「${ctx.line(loser, 'lose')}」`, { side: loser.side });
  }
  const key = [...ctx.log].reverse().find(e => e.kind === 'skill' || e.kind === 'big');
  return {
    winner: winner ? winner.side : null, reason, rounds: ctx.round, log: ctx.log, stage: ctx.stage,
    A: { name: A.name, hp: Math.max(0, Math.round(A.hp)), maxHp: A.maxHp },
    B: { name: B.name, hp: Math.max(0, Math.round(B.hp)), maxHp: B.maxHp },
    key: key ? key.skill || key.text.slice(0, 24) : '地力の差',
    state: [A, B].map(f => ({ rec: f.rec, flags: f.flags, meters: f.meters, resolve: f.resolve, forfeit: f.forfeit, hp: f.hp, maxHp: f.maxHp }))
  };
}

// =====================================================================
// キャラごとの部品（技・弱点・台詞）
//   文章の技を、戦いの中の動きに置き換えたもの。
//   uses … 舞台の特徴が参照する性質（rock=岩を使う, sound=音で戦う, wind=風・帆を使う, irregular=動きが読めない）
// =====================================================================
const skill = (ctx, f, name, text, extra = {}) => ctx.say('skill', `${f.name}の「${name}」！ ${text}`, { side: f.side, skill: name, ...extra });
const gradeGap = (a, b) => GRADE_ORDER.indexOf(b.grade) - GRADE_ORDER.indexOf(a.grade);   // 相手が何段上か

const FIGHTER_KITS = {

  // ------------------------------------------------------------------ 001
  chr_001: {
    short: 'ヴァルガルド',
    uses: [],
    lines: {
      intro: ['勝負だと？　ならば戦争だ', '始めるぞ。最後まで勝敗を決める'],
      attack: ['巨大な腕で殴りつけた', '全身の装甲ごと体当たりした', '翼の刃で薙ぎ払った'],

        skill(ctx, f, '大戦神装', '全武装が最大規模まで発達した。翼は巨大化し、無数の刃と鎖が展開される');
      }
    },
    statMul(f, stat) {
      const s = f.meters.stage || 1;

      if (!f.flags.endWar && f.meters.stage >= 2 && (foe.hp < foe.maxHp * 0.3 || f.hp < f.maxHp * 0.2)) {

        };
      }
      // 征服鎖：速い相手・遠距離の相手を捕まえる
      if (!foe.bind && r.chance(foe.tags.has('遠距離') || statOf(foe, 'spd') > statOf(f, 'spd') ? 0.2 : 0.08)) {

      }
      return { name: ctx.line(f, 'attack') };
    },
    damageIn(ctx, f, src, dmg) { return dmg * 0.94; }   // 受けながら前進する
  },

  // ------------------------------------------------------------------ 002
  chr_002: {

    mentalRes: 0.4,     // 防御能力：精神攻撃への耐性が非常に高い

      attack: ['産声衝撃を放った', '巨大な肉体で殴りつけた', '掴んで叩きつけた'],
      low: ['痛いから何だ。生きているなら痛むこともある'],

    onStart(ctx, f, foe) {

      foe.flags.reality = p;
      skill(ctx, f, '第一声', `短い産声が響いた。${foe.name}は、自分の鼓動と呼吸と痛みを異常なほど鮮明に感じ始める`);

        foe.flags.fatigueExposed = true;
        if (down > 0.02) skill(ctx, f, '人生荷重', `${foe.name}は、ごまかしていた疲労と痛みを一気に自覚した`);
      }
      // 初泣領域：回避と奇襲を封じる
      if (!f.flags.cry && ctx.round >= 3) { f.flags.cry = true; skill(ctx, f, '初泣領域', '呼吸音と心音が異常に強調され、隠れることも奇襲することもできなくなった'); }
      // 死への距離：瀕死の相手へ

        if (foe.resolve === 'low' && ctx.r.chance(0.35 * ctx.mental(f, foe, 1))) {

  // ------------------------------------------------------------------ 003
  chr_003: {

    lines: {

      // 創世夢岩：岩の少ない舞台で一度だけ

      f.meters.conf = Math.max(0, f.meters.conf - loss);

      return 1;

    onHit(ctx, f) { f.meters.conf = Math.min(100, f.meters.conf + 2.5); },
    onDamaged(ctx, f, src, dmg, info) { if (info.big) f.meters.conf = Math.max(0, f.meters.conf - 12); },
    chooseAction(ctx, f, foe) {

      return { name: ctx.line(f, 'attack') };
    }
  }
};

    onRound(ctx, f) { if (ctx.round >= 4) ctx.enemies(f).forEach(t => addMod(t, { key: 'wireAll', stat: 'spd', mul: 1 - Math.min(0.2, ctx.round * 0.02), turns: 99 })); }
  },
  // デウマグナ：偽神魔界は狭く、自分だけが強くなる（集団戦用の技はない）
  chr_010: {}
};

function runTeamBattle(opts) {
  const r = battleRng(opts.seed ?? Math.floor(Math.random() * 1e9));
  const stage = { name: '無名の荒野', features: [], events: [], ...opts.stage };
  stage.features = [...(stage.features || [])];
  const size = Math.max(opts.teams[0].length, opts.teams[1].length);
  const ids = t => t.map(m => m.ch.id);
  for (const t of opts.teams) if (new Set(ids(t)).size !== t.length) throw new Error('同じキャラを同じチームに入れることはできません');

  const teams = opts.teams.map((t, side) => t.map((m, i) => {
    const f = makeFighter(m.ch, m.ind, side, stage);
    f.row = m.row === 'back' ? 'back' : 'front';
    f.slot = i;
    f.maxHp = f.hp = Math.round(f.maxHp * (TEAM_RULES.HP_MULT[size] || 1.3));
    f.tkit = TEAM_KITS[m.ch.id] || {};
    return f;
  }));
  const all = [...teams[0], ...teams[1]];
  applyStageFeatures(stage, all);
  for (const f of all) f.form = r.range(0.82, 1.18);
  const log = [];
  const alive = side => teams[side].filter(f => f.hp > 0 && !f.forfeit);
  const targetOf = new Map();

  const ctx = {
    r, stage, log, round: 0, teams, firstHit: null, team: true,
    A: teams[0][0], B: teams[1][0],
    allies: f => alive(f.side).filter(x => x !== f),
    enemies: f => alive(1 - f.side),
    setTarget: (f, t) => targetOf.set(f, t),
    foe(f) {
      let t = targetOf.get(f);
      if (!t || t.hp <= 0 || t.forfeit) { t = pickTarget(f); targetOf.set(f, t); }
      return t || teams[1 - f.side][0];
    },
    say(kind, text, extra = {}) { log.push({ round: ctx.round, kind, text, hp: all.map(x => Math.max(0, Math.round(x.hp))), ...extra }); },
    line(f, key) { const arr = f.kit.lines[key]; return arr ? r.pick(arr) : ''; },
    feat: name => stage.features.includes(name),
    mental(src, tgt, power) {
      let p = power * tgt.mentalRes;
      if (ctx.feat('生命の気配')) p *= 1.35;
      // カンタレイアの抱歌領域：味方の精神を支える
      if (ctx.allies(tgt).some(a => a.ch.id === 'chr_006')) p *= 0.6;
      if (tgt.kit.onMental) p = tgt.kit.onMental(ctx, tgt, src, p) ?? p;
      return p;
    },
    evasionNegated: f => f.mods.some(m => m.negateEvasion) || f.bind > 0,
    damage(src, tgt, amount, info = {}) { return applyDamage(ctx, src, tgt, amount, info); },
    attack(src, tgt, opt) { return doAttack(ctx, src, tgt, opt); },
    // 並びの効果
    rowMul(f, foe) {
      let m = 1;
      if (f.row === 'front' && f.tags.has('遠距離')) m *= TEAM_RULES.FRONT_RANGED;
      if (f.row === 'back' && f.tags.has('近接') && !f.tags.has('飛行')) m *= TEAM_RULES.BACK_MELEE;
      m *= foe.row === 'back' ? TEAM_RULES.BACK_TAKEN : TEAM_RULES.FRONT_TAKEN;
      m *= (typeof TEAM_TUNE !== 'undefined' && TEAM_TUNE[f.ch.id]) || 1;   // 集団戦用の強さの補正値
      return m;
    },
    // 味方をかばう効果
    beforeDamage(src, tgt, dmg, info) {
      let d = dmg;
      for (const g of ctx.allies(tgt).concat([tgt])) if (g.tkit.protect && g.hp > 0) d = g.tkit.protect(ctx, g, tgt, d);
      if (src && src.side !== tgt.side) for (const a of ctx.allies(tgt)) a.tkit.onAllyHurt?.(ctx, a, tgt, src);
      if (tgt.kit.onFallWatch) tgt.kit.onFallWatch(ctx, tgt);
      return d;
    }
  };
  function pickTarget(f) {
    const en = alive(1 - f.side);
    if (!en.length) return null;
    const front = en.filter(x => x.row === 'front'), back = en.filter(x => x.row === 'back');
    let pool = front.length ? front : back;
    const backRate = (f.tkit.targetBack ?? (f.tags.has('遠距離') || f.tags.has('飛行') ? TEAM_RULES.BACK_TARGET_RANGED : TEAM_RULES.BACK_TARGET));
    if (front.length && back.length && r.chance(backRate)) pool = back;
    // 弱っている相手を少し狙いやすい
    return pool.slice().sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp + r.range(-0.25, 0.25))[0];
  }

  stage.setup?.(ctx);
  ctx.say('stage', `舞台：${stage.name}${stage.features.length ? `（${stage.features.join('・')}）` : ''}　${teams[0].length}対${teams[1].length}`);
  for (const f of all) {
    if (f.form >= 1.1) ctx.say('info', `${f.name}は絶好調だ`, { side: f.side });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'intro')}」`, { side: f.side });
  }
  stage.enemyState?.(ctx, teams[1], teams[0]);
  for (const f of all) f.kit.onStart?.(ctx, f, ctx.foe(f));

  const sideDone = side => alive(side).length === 0;
  while (!sideDone(0) && !sideDone(1) && ctx.round < BATTLE_RULES.MAX_ROUNDS) {
    ctx.round++;
    ctx.say('round', `ラウンド ${ctx.round}`);
    if (ctx.feat('異界') && ctx.round % 3 === 0) { for (const f of all) f.mods = f.mods.filter(m => m.permanent); ctx.say('event', '異界の揺らぎで、全員の強化と弱体化が消えた'); }
    for (const ev of stage.events || []) if ((ev.at && ev.at === ctx.round) || (ev.every && ctx.round % ev.every === 0)) ev.run(ctx);
    for (const f of all) if (f.hp > 0 && !f.forfeit) { targetOf.delete(f); f.kit.onRound?.(ctx, f, ctx.foe(f)); f.tkit.onRound?.(ctx, f); }
    const order = all.filter(f => f.hp > 0 && !f.forfeit)
      .sort((x, y) => (statOf(y, 'spd') * r.range(0.85, 1.15) + (y.kit.initiative?.(ctx, y) || 0)) - (statOf(x, 'spd') * r.range(0.85, 1.15) + (x.kit.initiative?.(ctx, x) || 0)));
    for (const f of order) {
      if (sideDone(0) || sideDone(1)) break;
      if (f.hp <= 0 || f.forfeit) continue;
      teamAct(ctx, f);
    }
    for (const f of all) {
      if (f.hp <= 0 && !f.flags.tDown) { f.flags.tDown = true; ctx.say('big', `${f.name}が倒れた`, { side: f.side }); }
      if (f.hp <= 0) continue;
      f.kit.onRoundEnd?.(ctx, f, ctx.foe(f));
      for (const m of f.mods) m.turns--;
      const expired = f.mods.filter(m => m.turns <= 0 && m.onExpire);
      f.mods = f.mods.filter(m => m.turns > 0);
      expired.forEach(m => m.onExpire(ctx, f));
      if (f.bind > 0) { f.rec.bound = true; f.rec.boundRounds++; f.bind--; }
      f.rec.minHp = Math.min(f.rec.minHp, Math.max(0, f.hp) / f.maxHp);
      if (ctx.round === 10) f.rec.minHpAtR10 = f.rec.minHp;
    }
  }

  // 決着
  let winner = null, reason = '';
  if (sideDone(1) && !sideDone(0)) { winner = 0; reason = '相手チームが全員倒れた'; }
  else if (sideDone(0) && !sideDone(1)) { winner = 1; reason = '自分のチームが全員倒れた'; }
  else if (sideDone(0) && sideDone(1)) { reason = '相打ち'; }
  else {
    const ratio = side => teams[side].reduce((s, f) => s + Math.max(0, f.hp), 0) / teams[side].reduce((s, f) => s + f.maxHp, 0);
    const a = ratio(0), b = ratio(1);
    winner = a === b ? null : a > b ? 0 : 1;
    reason = `${BATTLE_RULES.MAX_ROUNDS}ラウンドを戦い抜き、残り体力の合計で判定`;
    ctx.say('info', reason);
  }
  if (winner !== null) {
    const w = alive(winner)[0] || teams[winner][0];
    ctx.say('talk', `${w.name}「${ctx.line(w, 'win')}」`, { side: winner });
  }
  return {
    winner, reason, rounds: ctx.round, log, stage,
    fighters: all.map(f => ({ side: f.side, id: f.ch.id, name: f.name, row: f.row, hp: Math.max(0, Math.round(f.hp)), maxHp: f.maxHp, grade: f.grade })),
    state: all.map(f => ({ side: f.side, id: f.ch.id, rec: f.rec, flags: f.flags, meters: f.meters, resolve: f.resolve, forfeit: f.forfeit, hp: f.hp, maxHp: f.maxHp }))
  };
}

// 集団戦の1回の行動：集団戦用の技 → 1対1の技、の順に考える
function teamAct(ctx, f) {
  const foe = ctx.foe(f);
  if (!foe) return;
  if (f.stun > 0) { f.stun--; f.rec.stunned++; if (f.kit.onStunned?.(ctx, f, foe)) return; ctx.say('info', `${f.name}は動けない`, { side: f.side }); return; }
  if (!f.ambUsed && f.hp <= f.maxHp * 0.3) {
    f.ambUsed = true;
    addMod(f, { key: 'amb', stat: 'atk', mul: 1 + f.base.amb / 600, turns: 99, permanent: true });
    ctx.say('talk', `${f.name}「${ctx.line(f, 'low')}」`, { side: f.side, note: '野望力で攻撃が上がった' });
  }
  const t = f.tkit.action?.(ctx, f);
  if (t) {
    if (t.special) { t.special(ctx, f); return; }
    if (t.area) {
      ctx.say(t.big ? 'big' : 'skill', `${f.name}の「${t.name}」！ ${t.label || ''}`, { side: f.side, skill: t.name });
      const targets = ctx.enemies(f);
      let total = 0;
      for (const x of targets) {
        const before = x.hp;
        doAttack(ctx, f, x, { ...t, label: '', name: t.name, mult: t.mult / Math.sqrt(targets.length) * 1.1, big: false, quiet: true });
        total += Math.max(0, before - x.hp);
        t.each?.(ctx, f, x);
      }
      t.after?.(ctx, f);
      return;
    }
    doAttack(ctx, f, foe, t);
    return;
  }
  const action = f.kit.chooseAction?.(ctx, f, foe, false) || { name: ctx.line(f, 'attack') };
  if (action.skip) { if (action.text) ctx.say('info', action.text, { side: f.side }); return; }
  if (action.special) { action.special(ctx, f, foe); return; }
  const before = foe.hp;
  doAttack(ctx, f, foe, action);
  if (foe.hp < before) f.tkit.afterHit?.(ctx, f, foe);
}

// 集団戦用の強さの補正値（1対1の KIT_TUNE に重ねて掛かる）。tools/team-sim.js --calibrate で合わせる
const TEAM_TUNE = { chr_001: 0.896, chr_002: 0.868, chr_003: 1.043, chr_004: 1.292, chr_005: 0.772, chr_006: 0.7, chr_007: 1.13, chr_008: 1.417, chr_009: 0.763, chr_010: 0.924 };

//   各キャラの試練の段階3をクリアすると開く。「そのキャラ＋仲間」のチームと戦う
//   size … 2 なら 2対2、3 なら 3対3。自分のチームも同じ人数（同じキャラは入れられない）
//   enemies … 相手チーム（キャラid と並び）。個体値は TEAM_ENEMY_IND
//   events と enemyState は、チーム全員に効く形で書いてある

const teamWon = res => res.winner === 0;
const noneDown = res => res.state.filter(s => s.side === 0).every(s => s.hp > 0);
const downOrder = res => res.log.filter(e => e.kind === 'big' && e.text.endsWith('が倒れた')).map(e => e.side);

    goal: { text: '52ラウンド以内に勝つ', check: res => teamWon(res) && res.rounds <= 52 } },

  { id: 't008', boss: 'chr_008', size: 3, name: '最悪の体調の訓練場', features: ['寒冷', '強風'],
    enemies: [{ id: 'chr_005', row: 'front' }, { id: 'chr_009', row: 'front' }, { id: 'chr_008', row: 'back' }],
    story: '風邪気味で機嫌の悪いバサラが、なぜか訓練に参加している。怠け者の巨体と、うるさい教官も一緒だ。',
    enemyText: 'バサラは最初から体調が悪く、機嫌も悪い。挑戦者は全員、少し風邪気味で始まる',
    eventText: '5ラウンドごとにくしゃみが連鎖し、暴風が全員を巻き込む',
    events: [{ every: 5, run(ctx) { if (!ctx.r.chance(0.6)) return; allFighters(ctx).forEach(f => { f.shield = 0; ctx.damage(null, f, f.maxHp * 0.02, { event: true }); }); ctx.say('event', 'くしゃみが連鎖し、暴風が全員を巻き込んだ'); } }],
    enemyState(ctx, enemies, allies) { enemies.forEach(f => { if (f.ch.id === 'chr_008') f.meters.ill = 60; }); allies.forEach(f => { f.meters.cold = 2; addMod(f, { key: 'cold', stat: 'atk', mul: 0.96, turns: 99 }); }); },
    goal: { text: '32ラウンド以内に勝つ（体調が崩れる前に）', check: res => teamWon(res) && res.rounds <= 32 } },

  { id: 't009', boss: 'chr_009', size: 3, name: '地獄の合同訓練', features: ['強風', '狭所'],
    enemies: [{ id: 'chr_009', row: 'front' }, { id: 'chr_001', row: 'front' }, { id: 'chr_010', row: 'front' }],
    story: '「お前は、それでも進むか？」――教官と、戦争の化身と、自称・神魔王。三人並んだ前衛の圧に、逃げ場はない。',
    enemyText: 'トツカイザーのワイヤーが、最初から張られている',
    eventText: '15ラウンド目に「それでも進むか？」と問われ、覚悟の高いキャラが強くなる',
    events: [{ at: 15, run(ctx) { allFighters(ctx).filter(f => f.resolve === 'high').forEach(f => addMod(f, { key: 'tev_ask', stat: 'atk', mul: 1.12, turns: 999, permanent: true })); ctx.say('event', '「お前は、それでも進むか？」――問いが響いた'); } }],
    enemyState(ctx, enemies) { enemies.forEach(f => { if (f.ch.id === 'chr_009') f.meters.wire = 30; }); },
    goal: { text: '最初の10ラウンドを、味方全員が体力半分以上で耐えて勝つ', check: res => teamWon(res) && res.state.filter(s => s.side === 0).every(s => s.rec.minHpAtR10 == null || s.rec.minHpAtR10 >= 0.5) } },

  { id: 't010', boss: 'chr_010', size: 2, name: '偽神魔界の玉座の間', features: ['祭壇', '歓声'],
    enemies: [{ id: 'chr_010', row: 'front' }, { id: 'chr_008', row: 'back' }],
    story: '「我こそ神！」と叫ぶ神魔王と、「うるせぇ！！」と叫ぶ風邪の化身。どちらも声が大きい。',
    enemyText: 'デウマグナの自信が減りにくい',
    eventText: '4ラウンドごとに玉座が軋み、押されているチームの自信のキャラが揺らぐ',
    events: [{ every: 4, run(ctx) { allFighters(ctx).filter(f => f.tags.has('自信')).forEach(f => { const mine = ctx.teams[f.side], theirs = ctx.teams[1 - f.side]; const r = t => t.reduce((a, x) => a + Math.max(0, x.hp), 0) / t.reduce((a, x) => a + x.maxHp, 0); if (r(mine) < r(theirs)) { if (f.meters.conf != null) f.meters.conf = Math.max(0, f.meters.conf - 12); addMod(f, { key: 'tev_throne', stat: 'atk', mul: 0.94, turns: 2 }); } }); } }],
    enemyState(ctx, enemies) { enemies.forEach(f => { if (f.ch.id === 'chr_010') f.flags.steady = true; }); },
    goal: { text: 'デウマグナの偽神魔界を崩してから勝つ', check: res => teamWon(res) && res.log.some(e => e.text.includes('偽神魔界が崩れた') && e.side === 1) } }
];

// 集団戦のクエストごとの敵の強さ。tools/team-sim.js --calibrate で合わせる
const TEAM_STAGE_POWER = { t001: 1.163, t002: 0.924, t003: 0.84, t004: 1.096, t005: 1.182, t006: 0.937, t007: 0.794, t008: 0.972, t009: 1.08, t010: 1.029 };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const by = Object.fromEntries(BATTLE_CHARS.map(c => [c.id, c]));
const short = id => FIGHTER_KITS[id].short;
const rollOne = () => { const y = -Math.log10(1 - Math.random()); const d = (-1.4 + Math.sqrt(1.96 + 1.2 * y)) / 0.6; return Math.floor(100 * Math.pow(10, d)); };
const newInd = () => ({ power: rollOne(), speed: rollOne(), wisdom: rollOne() });
const autoRow = id => by[id].tags.includes('遠距離') ? 'back' : 'front';
const MODES = [
  ...TEAM_STAGES.map((s, i) => ({ key: 'q' + i, label: `集団戦クエスト：${s.name}（${s.size}対${s.size}）`, stage: s })),
  { key: 'p2', label: '練習試合：2対2', size: 2 },
  { key: 'p3', label: '練習試合：3対3', size: 3 }
];
const state = { mode: 0, mine: [], foe: [], token: 0, fast: false, skip: false, compact: false };
function setCompact(on) { state.compact = on; document.querySelector('.app').classList.toggle('compact', on); const v = document.getElementById('view'); if (v) v.textContent = on ? '絵を大きく' : '実況を広く'; }
function curMode() { return MODES[state.mode]; }
function size() { const m = curMode(); return m.stage ? m.stage.size : m.size; }
function defaultTeam(n, avoid = []) {
  const ids = ['chr_001', 'chr_006', 'chr_007', 'chr_009', 'chr_002', 'chr_003'].filter(x => !avoid.includes(x)).slice(0, n);
  return ids.map(id => ({ id, row: autoRow(id), ind: newInd() }));
}
function setMode(i) {
  setCompact(false);
  state.mode = i; const m = curMode(); const n = size();
  state.mine = (state.mine.length >= n ? state.mine.slice(0, n) : [...state.mine, ...defaultTeam(n, state.mine.map(x => x.id)).slice(0, n - state.mine.length)]);
  if (m.stage) state.foe = m.stage.enemies.map(e => ({ id: e.id, row: e.row, ind: { ...TEAM_ENEMY_IND } }));
  else state.foe = defaultTeam(n, ['chr_001', 'chr_006', 'chr_007']).length >= n ? [{ id: 'chr_005', row: 'front', ind: newInd() }, { id: 'chr_008', row: 'back', ind: newInd() }, { id: 'chr_010', row: 'front', ind: newInd() }].slice(0, n) : defaultTeam(n);
  $('#line').textContent = m.stage ? `特徴：${m.stage.features.join('・')}　／　目標：${m.stage.goal.text}` : '練習試合（報酬なし）。「編成」で相手のチームも変えられます';
  drawTeams(); renderInfo(); renderEdit();
}
function drawTeams(hp) {
  const cell = (m, idx) => {
    const cur = hp ? hp[idx] : null, max = hp ? hp.max[idx] : 1;
    const pct = cur == null ? 100 : Math.max(0, cur) / max * 100;
    return `<div class="cell ${cur != null && cur <= 0 ? 'down' : ''}"><img src="${IMAGES[m.id]}" alt="${esc(by[m.id].name)}">
      <div class="cap"><div class="nm">${esc(short(m.id))}</div><div class="hpbar"><i class="${pct <= 30 ? 'low' : ''}" style="width:${pct}%"></i></div></div></div>`;
  };
  const weights = [];
  const col = (list, offset, row, side, label) => {
    const items = list.map((m, i) => [m, i + offset]).filter(([m]) => m.row === row);
    weights.push(items.length === 0 ? 0.5 : items.length === 1 ? 1 : items.length === 2 ? 1.1 : 1.8);   // 人数の多い列ほど広く、空の列は細く
    return `<div class="col ${side}"><div class="cl">${items.length ? label : label.replace('味方', '').replace('敵', '')}</div><div class="cells ${items.length >= 3 ? 'n3' : ''}">${items.length ? items.map(([m, idx]) => cell(m, idx)).join('') : '<div class="empty"></div>'}</div></div>`;
  };
  const n0 = state.mine.length;
  $('#field').innerHTML = col(state.mine, 0, 'back', 'me', '味方後衛') + col(state.mine, 0, 'front', 'me', '味方前衛') +
    col(state.foe, n0, 'front', 'foe', '敵前衛') + col(state.foe, n0, 'back', 'foe', '敵後衛');
  $('#field').style.gridTemplateColumns = weights.map(w => w + 'fr').join(' ');
  // 真ん中の点線を、味方と敵の境目に合わせる
  const total = weights.reduce((a, b) => a + b, 0);
  $('#field').style.setProperty('--mid', ((weights[0] + weights[1]) / total * 100) + '%');
}
function renderEdit() {
  const m = curMode();
  const block = (side, list, locked) => `<h3 style="margin-top:10px">${side === 0 ? '自分のチーム' : '相手のチーム'}${locked ? '（クエストで決まっている）' : ''}</h3>` + list.map((x, i) => `
    <div class="pick"><select data-side="${side}" data-i="${i}" ${locked ? 'disabled' : ''}>${BATTLE_CHARS.map(c => `<option value="${c.id}" ${c.id === x.id ? 'selected' : ''}>${esc(c.name)}（${c.grade}級）</option>`).join('')}</select>
    <div class="seg"><button data-row="front" data-side="${side}" data-i="${i}" aria-pressed="${x.row === 'front'}" ${locked ? 'disabled' : ''}>前衛</button><button data-row="back" data-side="${side}" data-i="${i}" aria-pressed="${x.row === 'back'}" ${locked ? 'disabled' : ''}>後衛</button></div></div>`).join('');
  $('#teamEdit').innerHTML = block(0, state.mine, false) + block(1, state.foe, !!m.stage) + '<p class="warn" id="dupWarn"></p>';
  document.querySelectorAll('#teamEdit select').forEach(s => s.onchange = e => {
    const list = +s.dataset.side === 0 ? state.mine : state.foe; const i = +s.dataset.i;
    if (list.some((x, j) => j !== i && x.id === s.value)) { $('#dupWarn').textContent = '同じキャラは同じチームに入れられません'; s.value = list[i].id; return; }
    list[i] = { id: s.value, row: autoRow(s.value), ind: newInd() }; renderEdit(); drawTeams();
  });
  document.querySelectorAll('#teamEdit [data-row]').forEach(b => b.onclick = () => {
    const list = +b.dataset.side === 0 ? state.mine : state.foe; list[+b.dataset.i].row = b.dataset.row; renderEdit(); drawTeams();
  });
}
function renderInfo() {
  const m = curMode();
  if (!m.stage) { $('#infoBody').innerHTML = `<div class="info"><h3>練習試合</h3><p class="small">好きなチームどうしで戦わせます。報酬はありません。</p></div>`; return; }
  const s = m.stage;
  $('#infoBody').innerHTML = `<div class="info"><h3>${esc(s.name)}（${s.size}対${s.size}）</h3><p style="margin:0 0 4px">${esc(s.story)}</p><dl>
    <dt>相手</dt><dd>${s.enemies.map(e => `${esc(by[e.id].name)}（${e.row === 'back' ? '後衛' : '前衛'}）`).join('<br>')}</dd>
    <dt>舞台の特徴</dt><dd>${s.features.map(f => `<b>${esc(f)}</b>：${esc(STAGE_FEATURES[f].text)}`).join('<br>')}</dd>
    <dt>敵の状態</dt><dd>${esc(s.enemyText)}</dd><dt>出来事</dt><dd>${esc(s.eventText)}</dd>
    <dt>挑戦目標</dt><dd>${esc(s.goal.text)}</dd><dt>報酬</dt><dd>初回 ${TEAM_REWARDS.first}／2回目以降 ${TEAM_REWARDS.repeat}／目標達成 +${TEAM_REWARDS.goal}</dd>
  </dl></div>`;
}
function evHtml(e, names) {
  let t = esc(e.text);
  names.forEach(([n, side]) => { t = t.split(esc(n)).join(`<b class="s${side}">${esc(n)}</b>`); });
  return `<p class="ev ${e.kind}">${t}${e.note ? `<span class="note">${esc(e.note)}</span>` : ''}</p>`;
}
function compress(log) {
  const out = []; let buf = [];
  const flush = () => {
    if (!buf.length) return;
    const rounds = [...new Set(buf.map(e => e.round))];
    if (rounds.length <= 1) { buf.forEach(e => out.push(e)); buf = []; return; }
    const d = [0, 0]; buf.forEach(e => { if (e.dmg && e.side != null) d[e.side] += e.dmg; });
    const last = buf[buf.length - 1];
    out.push({ kind: 'sum', round: last.round, text: `ラウンド${rounds[0]}〜${rounds[rounds.length - 1]}：乱戦が続く（自分のチームが${d[0]}、相手のチームが${d[1]}ダメージ）`, hp: last.hp });
    buf = [];
  };
  for (const e of log) { if (e.kind === 'round') continue; if (e.kind === 'hit' || e.kind === 'miss') { buf.push(e); continue; } flush(); out.push(e); }
  flush(); return out;
}
async function go() {
  const my = ++state.token; state.skip = false;
  const btn = $('#go'); btn.textContent = 'やり直す'; btn.classList.add('running');
  setCompact(true);
  const feed = $('#feed'); feed.innerHTML = '';
  const m = curMode();
  const teams = [state.mine.map(x => ({ ch: by[x.id], ind: x.ind, row: x.row })), state.foe.map(x => ({ ch: by[x.id], ind: x.ind, row: x.row }))];
  const res = runTeamBattle({ teams, stage: m.stage ? { name: m.stage.name, features: [...m.stage.features], events: m.stage.events, enemyState: m.stage.enemyState, enemyPower: TEAM_STAGE_POWER[m.stage.id] } : { name: '練習場', features: [] } });
  const max = res.fighters.map(f => f.maxHp);
  const names = res.fighters.map(f => [f.name, f.side]);
  drawTeams(Object.assign(max.slice(), { max }));
  const wait = ms => new Promise(r => setTimeout(r, state.skip ? 0 : state.fast ? ms / 4 : ms));
  for (const e of compress(res.log)) {
    if (my !== state.token) return;
    feed.insertAdjacentHTML('beforeend', evHtml(e, names));
    if (e.hp) drawTeams(Object.assign(e.hp.slice(), { max }));
    if (!state.skip) { feed.scrollTop = feed.scrollHeight; await wait(e.kind === 'skill' || e.kind === 'big' || e.kind === 'event' ? 900 : e.kind === 'sum' ? 700 : 450); }
  }
  if (my !== state.token) return;
  drawTeams(Object.assign(res.fighters.map(f => f.hp), { max }));
  const win = res.winner === 0;
  let extra = '';
  if (m.stage) { const ok = win && m.stage.goal.check(res); extra = `<div class="goalbox">挑戦目標：${esc(m.stage.goal.text)}<br><b class="${ok ? 'ok' : 'ng'}">${ok ? '達成！' : '未達成'}</b></div>`; }
  feed.insertAdjacentHTML('beforeend', `<div class="result"><h2>${win ? '勝利！' : res.winner === 1 ? '敗北…' : '引き分け'}</h2><p>${esc(res.reason)}／${res.rounds}ラウンド</p>${extra}</div>`);
  feed.scrollTop = feed.scrollHeight;
  btn.textContent = 'もう一度'; btn.classList.remove('running');
}
$('#mode').innerHTML = MODES.map((m, i) => `<option value="${i}">${esc(m.label)}</option>`).join('');
$('#mode').onchange = e => setMode(+e.target.value);
$('#reroll').onclick = () => { state.mine.forEach(x => x.ind = newInd()); if (!curMode().stage) state.foe.forEach(x => x.ind = newInd()); drawTeams(); };
$('#speed').onclick = e => { state.fast = !state.fast; e.target.textContent = state.fast ? '実況：はやい' : '実況：ふつう'; };
$('#skip').onclick = () => { state.skip = true; };
$('#go').onclick = go;
$('#view').onclick = () => setCompact(!state.compact);
$('#openTeam').onclick = () => $('#teamSheet').showModal();
$('#openInfo').onclick = () => $('#infoSheet').showModal();
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog.sheet').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
setMode(0);
</script>
</body>
</html>
