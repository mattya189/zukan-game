<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A4A">
<title>ガチャ図鑑</title>
<meta name="description" content="ガチャでマッチ神を集め、物語と能力を楽しむ図鑑ゲーム。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E2A4A'/%3E%3Ccircle cx='32' cy='28' r='19' fill='%23F5C230' stroke='%23F6F8FB' stroke-width='4'/%3E%3Cpath d='M17 28h30M24 45v10h16V45' fill='none' stroke='%23F6F8FB' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='28' r='6' fill='%23E6394A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #DDE5F0;
  --paper: #F6F8FB;
  --ink: #1E2A4A;
  --ink-soft: #5A6685;
  --line: #BFCADB;
  --red: #E6394A;
  --yellow: #F5C230;
  --gold: #E0A800;
  --green: #2FA36B;
  --r1: #8E99A8;
  --r2: #2FA894;
  --r3: #3B7DDD;
  --r4: #9B5DE5;
  --r5: #E0A800;
  --dot: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", monospace;
  --maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--maru); font-weight: 500; font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- 枠 ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--ink); color: var(--paper);
}
header.top h1 { font-family: var(--dot); font-weight: 400; font-size: 20px; margin: 0; }
.mode { font-size: 11px; padding: 1px 8px; border: 1px solid #56648A; border-radius: 99px; color: #B9C3DA; }
.coins {
  margin-left: auto; font-family: var(--dot); font-size: 16px;
  background: var(--yellow); color: var(--ink); padding: 2px 10px 2px 6px; border-radius: 99px;
  display: flex; align-items: center; gap: 5px;
}
.coins::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--gold); }
.coins.bump { animation: bump .4s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.icon-btn { background: none; border: 0; color: var(--paper); padding: 4px; line-height: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { position: relative; background: none; border: 0; padding: 8px 0 10px; font-size: 11px; font-weight: 700; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--red); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; line-height: 17px; font-family: var(--dot); }

main { padding: 14px; }
.muted { color: var(--ink-soft); }
.small { font-size: 12px; }
.loading { padding: 40px 0; text-align: center; color: var(--ink-soft); }
.error { background: #FCE4E6; border-left: 4px solid var(--red); padding: 12px; border-radius: 6px; }
h2.sec { font-size: 16px; margin: 18px 0 8px; }
h2.sec:first-child { margin-top: 0; }

.btn { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 12px; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--paper); }
.btn.gold { background: var(--yellow); border-color: var(--ink); color: var(--ink); }
.btn.wide { width: 100%; padding: 10px; }
.btn:disabled { opacity: .45; }
select, input[type="text"] { background: var(--paper); border: 2px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* ---------- キャラ絵 ---------- */
.art { position: relative; display: inline-grid; place-items: end center; flex-shrink: 0; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; transform-origin: 50% 100%; }
.gallery .lockbox { position: relative; overflow: hidden; }
.gallery .lockbox img { position: absolute; inset: 4px; width: calc(100% - 8px) !important; height: calc(100% - 8px) !important; object-fit: contain; }
.mcard .art, .zcell .art, .card .art, .row .art { margin-bottom: 2px; }
.art img.sil { filter: brightness(0) opacity(.22); }
.art.special::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px dashed var(--gold); animation: spin 8s linear infinite; pointer-events: none; }
.art.special img { filter: hue-rotate(160deg) saturate(1.3) drop-shadow(0 0 6px #FFE38A); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- ガチャ画面 ---------- */
.gacha-pickers { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 10px; margin:0 -2px; }
.gacha-picker { position:relative; flex:0 0 88%; scroll-snap-align:center; padding:0; overflow:hidden; border:3px solid transparent; border-radius:14px; background:var(--paper); line-height:0; }
.gacha-picker img { display:block; width:100%; aspect-ratio:2/1; object-fit:cover; }
.gacha-picker.selected { border-color:var(--yellow); box-shadow:0 0 0 2px var(--ink); }
.gacha-picker .limited-mark { position:absolute; top:7px; left:7px; padding:3px 9px; border-radius:99px; background:var(--red); color:#fff; font-size:11px; font-weight:900; line-height:1.4; }
.gacha-title { margin:8px 0 0; text-align:center; font-size:19px; line-height:1.35; }
.gacha-subtitle { margin:0; text-align:center; color:var(--ink-soft); font-size:12px; font-weight:700; }
.gacha-note { margin:10px 0; padding:8px 10px; border-radius:10px; background:#FFF3C4; font-size:12px; font-weight:700; }
.gacha-lineup { display:flex; gap:8px; overflow-x:auto; padding:4px 1px 8px; }
.gacha-lineup-item { flex:0 0 76px; text-align:center; font-size:11px; font-weight:700; line-height:1.25; }
.gacha-lineup-item .art { display:grid; margin:0 auto 3px; }
.machine { width: 180px; margin: 4px auto 0; }
.machine svg { display: block; width: 100%; height: auto; }
.pull-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
.pull { border: 2px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 10px 6px; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; align-items: center; }
.pull span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pull-10 { background: var(--red); color: var(--paper); }
.pull-10 span { color: #FFD9DD; }
.pull:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.pull:disabled { opacity: .5; }
.guarantee { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.card { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; width: 100%; }
.card.r3 { border-color: var(--r3); }
.card.r4 { border-color: var(--r4); background: #F3EBFD; }
.card.r5 { border-color: var(--r5); background: #FFF6D8; box-shadow: 0 0 0 3px #FFE9A3; }
.cname { font-weight: 900; font-size: 13px; line-height: 1.3; }
.cmeta { font-family: var(--dot); font-size: 12px; color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 2px; }
.tag { font-style: normal; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.tag.new { background: var(--r2); }
.tag.sp { background: var(--gold); color: var(--ink); }
.tag.rec { background: var(--red); }
.tag.best { background: var(--r3); }
.tag.title { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.tag.exp { background: var(--r2); }
.stars { font-size: 12px; letter-spacing: -1px; line-height: 1; }
.s1 { color: var(--r1); } .s2 { color: var(--r2); } .s3 { color: var(--r3); } .s4 { color: var(--r4); } .s5 { color: var(--r5); }

details.rates { margin-top: 18px; background: var(--paper); border-radius: 10px; padding: 10px 12px; }
details.rates summary { font-weight: 700; }
table.simple { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
table.simple th, table.simple td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.simple td.num { font-family: var(--dot); text-align: right; white-space: nowrap; }

/* ---------- ガチャ演出 ---------- */
.show { position: fixed; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 40%, #2C3B63, #141C33 70%); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; }
.show .skip { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 3; background: rgba(255,255,255,.12); color: var(--paper); border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: 3px 14px; font-weight: 700; }
.show-stage { flex: 1; display: grid; place-items: center; position: relative; }
.rays { position: absolute; width: 900px; height: 900px; left: 50%; top: 50%; margin: -450px 0 0 -450px; opacity: 0; transition: opacity .5s;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,90,.28) 0 8deg, transparent 8deg 22deg); animation: spin 14s linear infinite; }
.show.gold .rays { opacity: 1; }
.show.purple .rays { opacity: .55; background: repeating-conic-gradient(from 0deg, rgba(184,140,255,.25) 0 8deg, transparent 8deg 22deg); }
.big-capsule { position: relative; width: 150px; height: 164px; --cap: var(--r2); transform: translateY(-120vh); }
.big-capsule.drop { animation: drop .7s cubic-bezier(.3,1.4,.6,1) forwards; }
.big-capsule.shake { transform: none; animation: shake .5s; }
.big-capsule.ready { transform: none; }
.big-capsule span { position: absolute; left: 0; width: 150px; height: 82px; border: 4px solid var(--ink); transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .45s, background-color .25s; }
.big-capsule .top { top: 0; border-radius: 75px 75px 0 0; background: var(--cap); }
.big-capsule .top::after { content: ""; position: absolute; left: 26px; top: 16px; width: 34px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.55); transform: rotate(-25deg); }
.big-capsule .bottom { bottom: 0; border-radius: 0 0 75px 75px; background: var(--paper); border-top-width: 0; }
.big-capsule.open .top { transform: translate(-60px, -90px) rotate(-40deg); opacity: 0; }
.big-capsule.open .bottom { transform: translate(60px, 90px) rotate(30deg); opacity: 0; }
@keyframes drop { from { transform: translateY(-120vh); } to { transform: none; } }
@keyframes shake { 15% { transform: rotate(-12deg); } 35% { transform: rotate(10deg); } 55% { transform: rotate(-8deg); } 75% { transform: rotate(5deg); } }
.tap-hint { position: absolute; bottom: 22%; left: 0; right: 0; text-align: center; font-weight: 700; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 2; }
.flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

.show-results { flex: 1; overflow-y: auto; padding: calc(52px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)); }
.show-results .inner { max-width: 520px; margin: 0 auto; }
.show-results .cards { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.show-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.show-actions .btn { padding: 10px; color: var(--ink); }
.show-actions .btn.danger { color: var(--paper); }
.fcard { perspective: 700px; background: none; border: 0; padding: 0; min-height: 178px; }
.fcard .flipper { position: relative; display: block; width: 100%; height: 100%; min-height: 178px; transition: transform .45s; transform-style: preserve-3d; }
.fcard.flipped .flipper { transform: rotateY(180deg); }
.fcard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; }
.fcard .back { background: repeating-linear-gradient(45deg, #34436C 0 8px, #2B3860 8px 16px); border: 2px solid #56648A; display: grid; place-items: center; }
.fcard .back::after { content: "?"; font-family: var(--dot); font-size: 28px; color: #8C9AC0; }
.fcard.r4 .back { box-shadow: 0 0 14px 2px rgba(155,93,229,.8); border-color: var(--r4); }
.fcard.r5 .back { box-shadow: 0 0 18px 4px rgba(245,194,48,.9); border-color: var(--r5); }
.fcard .front { transform: rotateY(180deg); }
.fcard .front.card { height: 100%; color: var(--ink); }

/* ---------- 図鑑 ---------- */
.progress { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.progress .nums { display: flex; gap: 18px; align-items: baseline; }
.progress b { font-family: var(--dot); font-weight: 400; font-size: 28px; line-height: 1; }
.progress .nums span { font-size: 13px; color: #B9C3DA; }
.meter { height: 8px; background: #36446A; border-radius: 99px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--yellow); }
.claim-banner { display: flex; align-items: center; gap: 10px; background: #FFF3C4; border: 2px solid var(--gold); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; font-weight: 700; }
.claim-banner .btn { margin-left: auto; }

.zgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.zcell { position: relative; background: var(--paper); border: 0; border-radius: 12px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; }
.zcell .no { font-family: var(--dot); font-size: 11px; color: var(--ink-soft); align-self: flex-start; padding-left: 4px; }
.zcell .zname { font-weight: 900; font-size: 13px; }
.zcell .dotmark { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.slots { display: flex; gap: 3px; margin-top: 3px; }
.slots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.slots i.on1 { background: var(--r1); border-color: var(--r1); }
.slots i.on2 { background: var(--r2); border-color: var(--r2); }
.slots i.on3 { background: var(--r3); border-color: var(--r3); }
.slots i.on4 { background: var(--r4); border-color: var(--r4); }
.slots i.on5 { background: var(--r5); border-color: var(--r5); }

.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.gallery figure { margin: 0; background: #E9EEF5; border-radius: 10px; padding: 6px; text-align: center; }
.gallery figcaption { font-size: 11px; color: var(--ink-soft); }
.gallery .lockbox { aspect-ratio: 1; display: grid; place-items: center; font-size: 12px; color: var(--ink-soft); }
.zsec { border-top: 2px dashed var(--line); padding: 12px 0; }
.zsec h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.zsec .stars { font-size: 15px; }
.zcount { font-size: 11px; font-weight: 700; color: var(--ink-soft); background: #E6EBF3; border-radius: 99px; padding: 0 8px; }
.zcount.none { background: none; padding: 0; }
.zsec dl { margin: 0; display: grid; grid-template-columns: 4.5em 1fr; gap: 3px 10px; font-size: 14px; }
.zsec dt { color: var(--ink-soft); font-size: 12px; font-weight: 700; padding-top: 2px; }
.zsec dd { margin: 0; }
.ztitle { margin: 0 0 8px; font-size: 17px; font-weight: 900; line-height: 1.4; letter-spacing: .02em; }
.zukan-identity { padding: 10px 12px 12px; text-align: center; }
.zukan-identity h2 { margin: 0; font-size: 22px; }
.zukan-identity p { margin: 0 0 7px; color: var(--ink-soft); font-weight: 700; }
.zukan-identity > div { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; }
.zukan-identity em, .zukan-identity strong { font-style:normal; font-size:11px; border-radius:99px; padding:2px 9px; background:#E6EBF3; }
.zukan-identity .grade { color:#fff; background:var(--grade); }
.combat-type { display:inline-block; margin-bottom:12px; padding:5px 12px; border-radius:99px; background:var(--ink); color:#fff; font-weight:900; }
.combat-stats { display:grid; gap:7px; margin-bottom:12px; overflow:hidden; }
.combat-stat { display:grid; grid-template-columns:3.5em minmax(0,1fr) 2.5em; align-items:center; gap:7px; font-size:12px; font-weight:700; }
.combat-stat > div { height:12px; border-radius:99px; background:#DDE5F0; overflow:visible; }
.combat-stat i { display:block; height:100%; min-width:2px; max-width:120%; border-radius:99px; background:linear-gradient(90deg,var(--r3),var(--r4)); }
.combat-stat b { font-family:var(--dot); font-weight:400; }
.combat-labels { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
.combat-labels b, .combat-labels em { font-style:normal; font-size:11px; border-radius:5px; padding:2px 7px; background:#E6EBF3; }
.combat-labels b { background:#FFF3C4; }
.combat-effects { margin: 12px 0; border: 2px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.combat-effects > summary { padding: 10px 12px; cursor: pointer; font-weight: 900; background: #E6EBF3; list-style: none; }
.combat-effects > summary::-webkit-details-marker { display: none; }
.combat-effects > summary::after { content: "＋"; float: right; }
.combat-effects[open] > summary::after { content: "−"; }
.combat-effects-body { padding: 10px 12px 12px; }
.combat-role { margin: 0 0 8px; padding: 8px 10px; border-radius: 9px; background: #FFF3C4; font-size: 14px; line-height: 1.55; font-weight: 900; }
.combat-effect-list { margin: 0; }
.combat-effect-row { padding: 8px 0; border-top: 1px solid var(--line); }
.combat-effect-row:first-child { border-top: 0; }
.combat-effect-row dt { font-size: 13px; font-weight: 900; }
.combat-effect-row dd { margin: 3px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.combat-effect-row.weak { margin: 4px -6px 0; padding: 8px 6px; border-radius: 8px; border-top: 0; background: #FFF0F1; }
.combat-effect-row.weak dt, .combat-effect-row.weak dd { color: #B62436; }
.combat-team-title { margin: 12px 0 2px; padding-top: 10px; border-top: 2px solid var(--ink); font-size: 13px; }
.battle-help-list { display: grid; gap: 7px; clear: both; }
.battle-help-list details { border: 1.5px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.battle-help-list summary { padding: 9px 11px; cursor: pointer; font-weight: 900; list-style: none; }
.battle-help-list summary::-webkit-details-marker { display: none; }
.battle-help-list summary::after { content: "＋"; float: right; }
.battle-help-list details[open] summary::after { content: "−"; }
.battle-help-body { margin: 0; padding: 0 11px 11px; white-space: pre-line; font-size: 13px; line-height: 1.75; overflow-wrap: anywhere; }
.site-info-badge { display: inline-block; margin-bottom: 7px; padding: 3px 9px; border-radius: 99px; background: #FFF3C4; font-size: 11px; font-weight: 900; }
.site-info-lead { margin: 0 0 12px; font-size: 14px; line-height: 1.7; font-weight: 700; }
.site-info-menu { display: grid; gap: 7px; }
.site-info-menu .btn { text-align: left; }
.site-info-section { padding: 11px 0; border-top: 1px solid var(--line); }
.site-info-section:first-of-type { border-top: 0; }
.site-info-section h3 { margin: 0 0 4px; font-size: 14px; }
.site-info-section p { margin: 0; white-space: pre-line; font-size: 13px; line-height: 1.75; overflow-wrap: anywhere; }
.site-info-updated { margin: 14px 0 0; text-align: right; color: var(--ink-soft); font-size: 11px; }
.site-info-back { margin-bottom: 10px; }
.zfacts { background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px !important; }
.story { background: #fff; border-radius: 12px; border-left: 4px solid var(--ink); margin-top: 6px; }
.story summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 3px; }
.story summary::-webkit-details-marker { display: none; }
.story-label { font-size: 17px; font-weight: 900; color: var(--ink); letter-spacing: .03em; line-height: 1.5; }
.story-preview { font-size: 15px; line-height: 1.75; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-more, .story-less { justify-self: end; font-size: 12px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 99px; padding: 1px 12px; }
.story-less { display: none; background: #E6EBF3; color: var(--ink); }
.story[open] .story-preview, .story[open] .story-more { display: none; }
.story[open] .story-less { display: inline-block; }
.story[open] summary { padding-bottom: 0; }
.story-body { padding: 8px 18px 20px; font-size: 16px; line-height: 1.9; color: #17213B; }
.story-body p { margin: 0 0 .95em; }
.story-body p.q { margin: .45em 0 1em; padding: 8px 12px; background: #EEF2F7; border-radius: 8px; font-weight: 700; }
.story-body p.beat { font-weight: 900; font-size: 17px; margin: 1.35em 0 .7em; }
.story-body p.flow { margin: .15em 0 .55em; text-align: center; font-size: 14px; font-weight: 900; color: var(--ink); }
.story-body p:last-child { margin-bottom: 0; }
.story-tools { display: flex; justify-content: flex-end; gap: 6px; margin: 10px 0 0; }
.story-tools .btn { font-size: 12px; padding: 2px 10px; }
.locked { margin: 0; color: var(--ink-soft); background: repeating-linear-gradient(-45deg, transparent 0 6px, #E6EBF3 6px 12px); padding: 8px; border-radius: 6px; }
.title-list { display: flex; flex-wrap: wrap; gap: 5px; }
.title-list .tag { font-size: 12px; padding: 1px 7px; }
.title-list .tag.off { background: #E6EBF3; color: var(--ink-soft); box-shadow: none; }

/* 図鑑のキャラページ */
dialog.zukan-page-dialog {
  width: min(520px, calc(100vw - 24px)); max-width: none;
  height: 100vh; height: 100dvh;
  max-height: 100vh; max-height: 100dvh;
  margin-block: 0; border-radius: 0;
}
dialog.zukan-page-dialog .dlg-inner { height: 100%; max-height: none; padding: 0; overflow: hidden; }
dialog.zukan-page-dialog .dlg-close { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px; float: none; z-index: 8; }
dialog.zukan-page-dialog #dlgBody { height: 100%; }
.zukan-page { height: 100%; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
.zukan-hero { position: relative; min-height: 0; background: #EEF2F7; border-bottom: 1px solid var(--line); transition: height .22s ease; }
.zukan-art-stage {
  position: relative; height: clamp(216px, 38dvh, 350px); min-height: 0;
  display: grid; place-items: center; overflow: hidden;
  padding-bottom: 12px;
  background: radial-gradient(circle at 50% 52%, color-mix(in srgb, var(--zukan-el) 25%, white), #EEF2F7 72%);
  transition: height .22s ease, width .22s ease, transform .22s ease;
}
.zukan-art-stage::after { content: ""; position: absolute; left: 15%; right: 15%; bottom: 5px; height: 12px; border-radius: 50%; background: rgba(30,42,74,.1); filter: blur(4px); }
.zukan-no { position: absolute; top: 10px; left: 12px; z-index: 2; font-family: var(--dot); font-size: 15px; background: rgba(246,248,251,.9); border-radius: 99px; padding: 2px 10px; }
.zukan-stamps { position: absolute; top: 10px; right: 50px; z-index: 3; display: flex; gap: 4px; }
.zukan-stamp { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(30,42,74,.2); background: rgba(246,248,251,.86); color: var(--ink-soft); font-family: var(--dot); font-size: 10px; }
.zukan-stamp.on1 { color: #fff; background: var(--r1); border-color: var(--r1); }
.zukan-stamp.on2 { color: #fff; background: var(--r2); border-color: var(--r2); }
.zukan-stamp.on3 { color: #fff; background: var(--r3); border-color: var(--r3); }
.zukan-stamp.on4 { color: #fff; background: var(--r4); border-color: var(--r4); }
.zukan-stamp.on5 { color: var(--ink); background: var(--r5); border-color: var(--r5); }
.zukan-hero-media { position: absolute; inset: 40px 18px 20px; z-index: 2; display: block; min-width: 0; min-height: 0; overflow: hidden; }
.zukan-hero-media > img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; object-position: center bottom; }
.zukan-placeholder { display: block; width: min(78%, 270px); height: min(88%, 270px); }
.zukan-placeholder svg { width: 100%; height: 100%; }
.zukan-identity { min-height: 76px; padding: 7px 14px 9px; background: var(--paper); transition: padding .22s ease, min-height .22s ease; }
.zukan-identity h2 { margin: 0; padding-right: 38px; font-size: 24px; line-height: 1.25; }
.zukan-identity p { margin: 1px 0 2px; color: var(--ink); font-size: 13px; font-weight: 700; }
.zukan-identity > div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 3px; color: var(--ink-soft); font-size: 12px; }
.zukan-identity em { font-style: normal; background: #E3E8F0; color: var(--ink); border-radius: 99px; padding: 0 7px; font-weight: 700; }
.zukan-variants { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px !important; margin-top: 6px !important; }
.zukan-variants button { min-width: 0; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; padding: 3px 4px; font-size: 11px; font-weight: 700; }
.zukan-variants button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.zukan-variants button:disabled { opacity: .55; }
.zukan-variants small { display: block; font-size: 9px; font-weight: 500; }
.zukan-page-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--paper); border-bottom: 2px solid var(--ink); box-shadow: 0 3px 8px rgba(30,42,74,.08); z-index: 7; }
.zukan-page-tabs button { min-width: 0; border: 0; border-bottom: 4px solid transparent; background: transparent; padding: 8px 1px 6px; font-size: clamp(13px, 3.8vw, 15px); line-height: 1.35; white-space: nowrap; font-weight: 900; color: var(--ink-soft); }
.zukan-page-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--zukan-el); background: color-mix(in srgb, var(--zukan-el) 8%, white); }
.zukan-panels { min-height: 0; background: #E9EEF5; }
.zukan-panel { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 12px 18px calc(22px + env(safe-area-inset-bottom)); scroll-behavior: smooth; }
.zukan-character-panel { padding: 0 0 calc(12px + env(safe-area-inset-bottom)); background: #EEF2F7; }
.zukan-panel-title { margin: 14px 0 7px; font-size: 14px; }
.zukan-panel-title:first-child { margin-top: 0; }
.zukan-facts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.zukan-fact { min-width: 0; min-height: 52px; margin: 0; display: grid; grid-template-columns: minmax(4.6em, auto) 1fr; align-items: center; gap: 6px; background: #fff; border-radius: 9px; padding: 7px 8px; }
.zukan-fact dt { color: var(--ink-soft); font-size: 10px; font-weight: 700; line-height: 1.35; }
.zukan-fact dd { min-width: 0; margin: 0; font-weight: 900; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.zukan-fact dd b { font-family: var(--dot); font-weight: 400; }
.zukan-fact dd small { display: block; color: var(--ink-soft); font-size: 10px; font-weight: 500; }
.zukan-records { margin-bottom: 12px; }
.zukan-panel .bigcard { margin-top: 0; }
.zukan-panel > .story-tools { margin-top: 0; }

/* 本文を読み始めたら、絵と名前を小さな固定帯にまとめる */
.zukan-page.is-compact .zukan-hero { height: 58px; }
.zukan-page.is-compact .zukan-art-stage { position: absolute; left: 8px; top: 3px; width: 54px; height: 52px; padding: 0; border-radius: 8px; z-index: 2; }
.zukan-page.is-compact .zukan-art-stage::after, .zukan-page.is-compact .zukan-no { display: none; }
.zukan-page.is-compact .zukan-hero-media { inset: 2px; place-items: center; }
.zukan-page.is-compact .zukan-hero-media > img { object-position: center; }
.zukan-page.is-compact .zukan-identity { min-height: 58px; height: 58px; padding: 5px 48px 4px 70px; overflow: hidden; }
.zukan-page.is-compact .zukan-identity h2 { padding: 0; font-size: 16px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zukan-page.is-compact .zukan-identity p, .zukan-page.is-compact .zukan-identity em { display: none; }
.zukan-page.is-compact .zukan-identity > div { margin-top: 3px; }
.zukan-page.is-compact .zukan-identity .grade { font-size: 10px; white-space: nowrap; }
.zukan-panel .story { margin-top: 10px; border-left-width: 5px; }
.zukan-panel .story summary { padding: 13px 14px; }
.zukan-panel .story[open] summary { padding-bottom: 4px; }

@media (max-width: 360px) {
  .zukan-facts { grid-template-columns: 1fr; }
  .zukan-fact { min-height: 46px; }
  .zukan-art-stage { height: clamp(216px, 37dvh, 300px); }
  .zukan-panel { padding-left: 14px; padding-right: 14px; }
}

@media (max-height: 680px) {
  .zukan-art-stage { height: clamp(210px, 36dvh, 260px); }
  .zukan-identity { padding-top: 5px; padding-bottom: 6px; }
  .zukan-identity h2 { font-size: 21px; }
  .zukan-page-tabs button { padding-top: 6px; padding-bottom: 4px; }
}

/* ---------- 保管庫 ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar .count { font-family: var(--dot); font-size: 16px; margin-right: auto; }
.filter-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; align-items: center; }
.filter-row select { width: 100%; min-width: 0; padding: 5px 4px; font-size: 14px; }
.filter-row .check { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
.individual-sort { display:grid; grid-template-columns:2fr 1fr; gap:6px; margin-bottom:7px; }
.individual-sort label { min-width:0; color:var(--ink-soft); font-size:11px; font-weight:800; }
.individual-sort select { display:block; width:100%; min-width:0; margin-top:2px; padding:4px 5px; font-size:13px; }
.combat-filter-bar { display: flex; align-items: center; gap: 7px; margin: 7px 0; min-width: 0; }
.combat-filter-bar .btn { flex: none; padding: 4px 10px; font-size: 13px; }
.combat-filter-summary { min-width: 0; color: var(--ink-soft); font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combat-filter-count { margin-left: auto; flex: none; font-family: var(--dot); font-size: 12px; white-space: nowrap; }
.combat-filter-pop { max-height: min(48dvh, 390px); margin: 6px 0 10px; padding: 10px; overflow-y: auto; overscroll-behavior: contain; border: 2px solid var(--line); border-radius: 12px; background: #F7F9FC; box-shadow: 0 5px 14px #17213D1A; }
.combat-filter-group + .combat-filter-group { margin-top: 9px; }
.combat-filter-group strong { display: block; margin-bottom: 4px; color: var(--ink-soft); font-size: 12px; }
.combat-filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.combat-filter-chip { border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 9px; background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 800; }
.combat-filter-chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.combat-filter-clear { margin-top: 10px; width: 100%; }
.combat-filter-empty { padding: 14px 8px; text-align: center; }
.quest-recommend { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.quest-recommend button { border: 1.5px solid var(--red); border-radius: 99px; padding: 3px 9px; background: #FFF5F6; color: var(--red); font-size: 12px; font-weight: 900; }

/* ---------- はじめての案内 ---------- */
body.tutorial-active main { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
.tutorial-band { position: fixed; z-index: 18; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: calc(68px + env(safe-area-inset-bottom)); max-width: 472px; margin: auto; padding: 10px 11px; border: 2px solid var(--yellow); border-radius: 14px; background: #FFFDF4; box-shadow: 0 7px 24px #17213D3D; }
.tutorial-band strong { display: block; padding-right: 64px; font-size: 14px; line-height: 1.35; }
.tutorial-band p { margin: 4px 0 8px; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
.tutorial-step { position: absolute; top: 9px; right: 11px; color: var(--ink-soft); font-family: var(--dot); font-size: 11px; }
.tutorial-actions { display: flex; justify-content: flex-end; gap: 6px; }
.tutorial-actions .btn { padding: 3px 9px; font-size: 12px; }
.tutorial-target { position: relative; z-index: 2; outline: 4px solid var(--yellow) !important; outline-offset: 2px; animation: tutorialPulse 1.1s ease-in-out infinite; }
@keyframes tutorialPulse { 50% { outline-color: var(--red); box-shadow: 0 0 0 7px #F5BE4133; } }
body.practice-mode .tutorial-band { display: none; }
body.practice-mode.tutorial-active main { padding-bottom: 0; }
@media (max-height: 680px) {
  .tutorial-band { padding: 8px 9px; }
  .tutorial-band p { max-height: 3.1em; overflow-y: auto; }
}
.bulk { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.bulk .btn { font-size: 13px; padding: 4px 10px; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: var(--paper); border: 2px solid transparent; border-radius: 12px; padding: 6px 10px 6px 6px; text-align: left; }
.row.selected { border-color: var(--red); background: #FDEFF1; }
.row.dim { opacity: .55; }
.row .rt { font-weight: 900; }
.row .rs { font-size: 12px; color: var(--ink-soft); }
.row .rv { font-family: var(--dot); text-align: right; font-size: 15px; }
.row .rv small { display: block; font-size: 11px; color: var(--ink-soft); }
.individual-row { grid-template-columns:48px minmax(0,1fr); gap:8px; align-items:center; min-height:76px; }
.individual-main { display:block; min-width:0; }
.individual-top { display:flex; align-items:flex-start; gap:6px; min-width:0; }
.individual-top .rt { min-width:0; line-height:1.25; overflow-wrap:anywhere; }
.individual-sort-value { flex:none; margin-left:auto; color:var(--ink); font-family:var(--dot); font-size:17px; line-height:1; text-align:right; white-space:nowrap; }
.individual-sort-value small { display:block; margin-top:3px; color:var(--ink-soft); font-family:var(--maru); font-size:9px; font-weight:700; }
.individual-meta { display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.individual-stats { display:flex; flex-wrap:nowrap; align-items:center; gap:3px; margin-top:2px; color:var(--ink-soft); font-family:var(--dot); font-size:11px; white-space:nowrap; }
.individual-stats i { font-style:normal; opacity:.55; }
.individual-stats .active { color:var(--ink); font-weight:900; }
.individual-tags { justify-content:flex-start; margin-top:3px; }
.individual-row.release-warning { border-color:#E07A18; background:#FFF0D9; box-shadow:inset 4px 0 0 #E07A18; }
.individual-status { display:flex; justify-content:flex-end; gap:3px; margin:-18px 8px 3px 64px; pointer-events:none; }
.row.mine { border-color: var(--yellow); background: #FFF8DF; }
.rank-no { font-family: var(--dot); font-size: 18px; width: 2.2em; text-align: center; }
.rank-row { grid-template-columns: 2.4em 40px 1fr auto; }
.release-bar { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 9; padding: 10px 14px; background: var(--ink); }
.release-bar .inner { max-width: 492px; margin: 0 auto; display: flex; gap: 10px; align-items: center; color: var(--paper); }
.release-bar .inner span b, .release-bar .inner span small { display:block; }
.release-bar .inner span small { color:#DCE4F3; font-size:12px; }
.release-bar .btn { margin-left: auto; }
body.selecting main { padding-bottom: 70px; }
body.selecting .toast { bottom: calc(150px + env(safe-area-inset-bottom)); }
@media (max-width: 390px) {
  .individual-row { grid-template-columns:42px minmax(0,1fr); padding:6px 7px 6px 4px; gap:6px; }
  .individual-row .art { width:42px !important; height:42px !important; }
  .individual-top .rt { font-size:12px; }
  .individual-sort-value { font-size:15px; }
  .individual-meta, .individual-stats { font-size:10px; }
  .individual-tags .tag { font-size:9px; }
  .individual-status { margin-left:52px; }
}

/* ---------- 冒険 ---------- */
.panel { background: var(--paper); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.practice-entry { border: 2px solid var(--ink); background: linear-gradient(135deg, #fff, #FFF3C4); }
.practice-entry h2 { margin: 0 0 4px; }

.adventure-switch button { min-width:0; padding:8px 4px; border:0; border-radius:8px; background:transparent; color:var(--ink-soft); font-weight:900; }
.adventure-switch button.active { background:var(--paper); color:var(--ink); box-shadow:0 1px 3px #17213D22; }
.skill-cost{position:sticky;top:0;background:var(--paper);padding:7px;border-radius:8px;z-index:2}.skill-list{display:grid;gap:7px;margin:10px 0}.skill-row{text-align:left;border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px;color:var(--ink)}.skill-row.on{border-color:var(--red);background:#FFF1F3}.skill-row.locked{opacity:.6}.skill-row span{display:flex;justify-content:space-between}.skill-row em{font-style:normal;font-size:11px;color:var(--ink-soft)}.skill-row p{margin:4px 0 0;font-size:12px}.relay-entry,.relay-slot{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:13px;padding:11px;color:var(--ink)}.relay-entry{margin-bottom:15px}.relay-entry small,.relay-slot small{display:block;color:var(--ink-soft)}.relay-entry span{margin-left:auto}.relay-slots{display:grid;gap:8px;margin-bottom:12px}.relay-slot .art{flex:0 0 auto}.relay-empty{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#E5EAF2;font-size:25px}.relay-results details{background:var(--paper);border:1px solid var(--line);border-radius:9px;margin:7px 0;padding:8px}.relay-log{max-height:240px;overflow:auto;font-size:12px}.relay-log p{margin:3px 0}
.relay-enemies{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.relay-enemy{min-width:0;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 3px}.relay-enemy .art{margin:auto}.relay-enemy b,.relay-enemy small{display:block}.relay-enemy small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}

.relay-enemy.boss-ability-trigger{width:100%;position:relative;cursor:pointer;color:inherit;font:inherit}.relay-enemy.boss-ability-trigger:active{border-color:var(--yellow);transform:scale(.98)}.boss-list-hint{display:block;margin-top:5px;padding:3px 4px;border-radius:8px;background:#17213D;color:#fff;font-size:9px;font-weight:900}.boss-help-head{padding-right:30px}.boss-help-head h2{margin:5px 0 0}.boss-help-head p{margin:2px 0;color:var(--ink-soft);font-weight:700}.boss-help-badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#17213D;color:#fff;font-size:11px;font-weight:900}.boss-help-section{margin-top:12px;padding:10px;border-radius:12px;background:#EEF2F7}.boss-help-section h3{margin:0 0 7px;font-size:15px}.boss-ability-list,.boss-help-section ul{display:grid;gap:7px;margin:0;padding-left:20px}.boss-ability-list li strong,.boss-ability-list li span{display:block}.boss-ability-list li span{margin-top:2px;font-size:12px;color:var(--ink-soft)}.boss-help-section.hint{background:#FFF3C4}.boss-help-section.hint li{font-size:13px}

/* ---------- 練習試合 ---------- */
body.practice-mode { overflow: hidden; }
body.practice-mode header.top, body.practice-mode nav.tabs { display: none; }
body.practice-mode .app { height: 100vh; height: 100dvh; min-height: 0; padding: 0; }
body.practice-mode main { height: 100%; padding: 0; overflow: hidden; }
.practice-battle { height: 100%; padding: max(6px, env(safe-area-inset-top)) 8px max(6px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
.practice-top { flex: none; display: flex; align-items: center; gap: 7px; min-height: 30px; }
.practice-top h1 { margin: 0; font-family: var(--dot); font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.practice-mini { border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.practice-back { margin-right: auto; }
.practice-versus { flex: 0 1 42%; min-height: 170px; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 5px; align-items: stretch; }
.practice-vs { align-self: center; font-family: var(--dot); font-size: 21px; color: var(--red); }
.practice-corner { --c: var(--ink); min-width: 0; padding: 4px; display: flex; flex-direction: column; gap: 2px; border-radius: 11px; border-top: 5px solid var(--c); background: var(--paper); }
.practice-art { position: relative; flex: 1 1 auto; min-height: 76px; overflow: hidden; border-radius: 8px; background: radial-gradient(circle at 50% 65%, color-mix(in srgb, var(--c) 20%, transparent), transparent 70%); }
.practice-art img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: contain; object-position: center bottom; }
.practice-name { border: 0; width: 100%; padding: 1px 3px; background: #E8EDF5; border-radius: 6px; font-size: 11px; line-height: 1.45; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
select.practice-name { border: 1px solid var(--line); }
.practice-grade { color: var(--ink-soft); font-size: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.practice-grade b { display: inline-block; margin-right: 3px; padding: 0 5px; border-radius: 5px; background: var(--c); color: #fff; font-family: var(--dot); font-weight: 400; }
.practice-ind { display: flex; justify-content: space-between; gap: 1px; color: var(--ink-soft); font-size: 9px; white-space: nowrap; overflow: hidden; }
.practice-ind b { margin-left: 1px; color: var(--ink); font-family: var(--dot); font-size: 10px; font-weight: 400; }
.practice-hpbar { height: 8px; overflow: hidden; border-radius: 99px; background: #CCD4E0; }
.practice-hpbar i { display: block; height: 100%; background: var(--green); transition: width .3s; }
.practice-hpbar i.low { background: var(--red); }
.practice-hpnum { min-height: 1.15em; margin-top: -2px; text-align: right; font-family: var(--dot); font-size: 10px; }
.practice-stage { flex: none; padding: 5px 7px; border-radius: 10px; background: var(--paper); }
.practice-stage-row { display: flex; gap: 6px; align-items: center; }
.practice-stage-row label { font-size: 11px; font-weight: 700; }
.practice-stage-row select { flex: 1; min-width: 0; padding: 3px 5px; font-size: 11px; }
.practice-feature-line { margin: 1px 0 0; color: var(--ink-soft); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.practice-feed { flex: 1 1 auto; min-height: 82px; overflow-y: auto; overscroll-behavior: contain; padding: 6px 8px; border-radius: 10px; background: var(--paper); }
.practice-feed:empty::before { content: "個体と舞台を選んで「戦わせる」を押してください。"; color: var(--ink-soft); font-size: 12px; }
.practice-feed .ev { margin: 0 0 5px; font-size: 13px; }
.practice-feed .ev.stage, .practice-feed .ev.talk { font-weight: 900; }
.practice-feed .ev.info, .practice-feed .ev.miss { color: var(--ink-soft); }
.practice-feed .ev.skill { padding: 3px 7px; border-left: 4px solid var(--gold); background: #FFF3C4; font-weight: 700; }
.practice-feed .ev.big { padding: 3px 7px; border-left: 4px solid var(--red); background: #FCE4E6; font-weight: 900; }
.practice-feed .ev.sum { padding: 3px 7px; border-radius: 7px; background: #fff; color: var(--ink-soft); font-size: 11px; }
.practice-feed .ev b.s0 { color: #2F6FD6; } .practice-feed .ev b.s1 { color: var(--red); }
.practice-feed .note { display: block; color: var(--ink-soft); font-size: 10px; font-weight: 500; }
.practice-result { margin-top: 6px; padding: 8px; border-radius: 10px; background: var(--ink); color: var(--paper); text-align: center; }
.practice-result h2 { margin: 0; font-family: var(--dot); font-size: 20px; font-weight: 400; }
.practice-result p { margin: 1px 0 0; font-size: 11px; }
.practice-actions { flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr 1.35fr; gap: 4px; }
.practice-actions button { min-width: 0; padding: 7px 1px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font-size: 10px; line-height: 1.25; font-weight: 900; }
.practice-actions .go { background: var(--red); border-color: var(--red); color: #fff; font-size: 13px; }
.practice-actions .go.running { background: var(--paper); color: var(--red); }
.practice-features { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.practice-features button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
.practice-features button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.practice-pick-list { max-height: 52vh; overflow-y: auto; }
.battle-view-toggle { margin-left:auto; }
.practice-battle.log-wide .practice-versus { flex-basis:30%; min-height:120px; }
.practice-battle.log-wide .practice-stage { display:none; }
.practice-battle.log-wide .practice-feed { min-height:45vh; }
.practice-mode .practice-feed .ev { font-size:16px; line-height:1.75; }
.practice-mode .practice-feed .ev.sum { font-size:14px; }
.practice-mode .practice-feed .note { font-size:12px; }
.battle-mode-switch { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:5px; }
.battle-mode-switch button { border:1.5px solid var(--line); border-radius:8px; padding:4px 2px; background:var(--paper); font-size:11px; font-weight:900; }
.battle-mode-switch button.active { color:#fff; background:var(--ink); border-color:var(--ink); }
.team-battle { height:100%; padding:max(6px,env(safe-area-inset-top)) 7px max(6px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:5px; overflow:hidden; }
.team-field { --mid:50%; flex:0 1 42%; min-height:170px; display:grid; grid-template-columns:var(--team-cols,1fr 1fr 1fr 1fr); gap:3px; position:relative; padding:4px; border-radius:11px; background:var(--paper); }
.team-field::after { content:""; position:absolute; top:5px; bottom:5px; left:var(--mid); border-left:2px dashed var(--line); pointer-events:none; }
.team-col { min-width:0; display:flex; flex-direction:column; gap:3px; }
.team-col-label { flex:none; border-radius:5px; color:#fff; text-align:center; font-size:9px; font-weight:900; line-height:1.5; }
.team-col.me .team-col-label { background:#2F6FD6; }.team-col.foe .team-col-label { background:var(--red); }
.team-cells { flex:1; min-height:0; display:grid; grid-auto-rows:1fr; gap:3px; }
.team-cells.n3 { grid-template-columns:1fr 1fr; }.team-cells.n3 .team-cell:last-child { grid-column:1/-1; }
.team-cell { min-height:0; position:relative; overflow:hidden; border-radius:7px; background:#fff; }
.team-cell.empty { border:1.5px dashed var(--line); background:transparent; }
.team-cell.down { opacity:.35; filter:grayscale(1); }
.team-cell img { position:absolute; inset:2px 2px 22px; width:calc(100% - 4px); height:calc(100% - 24px); object-fit:contain; object-position:center bottom; }
.team-cell-cap { position:absolute; left:2px; right:2px; bottom:2px; }
.team-cell-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; font-size:9px; line-height:1.3; font-weight:900; }
.team-cell .practice-hpbar { height:6px; }
.team-battle.log-wide .team-field { flex-basis:29%; min-height:130px; }
.team-battle.log-wide .practice-stage { display:none; }
.team-battle.log-wide .practice-feed { min-height:45vh; }
.team-compose { display:grid; gap:7px; margin:8px 0; }
.team-compose-slot { display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:7px; padding:6px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
.team-compose-slot .art { grid-row:1/3; }.team-compose-slot strong { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
.team-compose-slot small { display:block; color:var(--ink-soft); font-size:10px; }
.team-row-toggle { border:1px solid var(--line); border-radius:7px; padding:4px 7px; background:var(--paper); font-size:11px; font-weight:900; }
.team-enemies { display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:5px; margin-top:6px; }
.team-enemy { min-width:0; padding:5px; border-radius:9px; background:#fff; text-align:center; }
.team-enemy img { width:100%; height:72px; object-fit:contain; object-position:center bottom; }.team-enemy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; }.team-enemy small { font-size:9px; color:var(--ink-soft); }
.team-mark { border:1px solid var(--line); border-radius:6px; padding:3px 1px; font-size:8px; font-weight:900; text-align:center; }
.team-mark.locked { color:var(--ink-soft); background:#E6EBF3; }.team-mark.cleared { color:#fff; background:var(--r3); }.team-mark.goal { background:var(--yellow); border-color:var(--gold); }
.quest-heading { display:flex; align-items:center; gap:8px; margin:14px 0 8px; }
.quest-heading h2 { margin:0; font-size:17px; }
.quest-count { margin-left:auto; padding:1px 8px; border-radius:99px; background:var(--ink); color:#fff; font-family:var(--dot); font-size:12px; }
.quest-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.quest-card { position:relative; min-width:0; padding:8px; border:2px solid var(--line); border-radius:12px; background:var(--paper); text-align:left; }
.quest-card.proof { border-color:var(--gold); box-shadow:inset 0 0 0 2px #FFF0A8; }
.quest-card-head { display:flex; align-items:center; gap:7px; min-width:0; }
.quest-card-head > .art { flex:0 0 auto; }
.quest-card-head > span { min-width:0; flex:1; }
.quest-card-head strong { display:block; overflow-wrap:anywhere; font-size:12px; line-height:1.35; }
.quest-card-head small { display:block; margin-top:3px; color:var(--ink-soft); font-size:10px; line-height:1.3; }
.quest-proof { position:absolute; top:5px; right:5px; padding:1px 6px; border-radius:99px; background:var(--gold); color:var(--ink); font-size:9px; font-weight:900; }
.quest-levels { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin-top:6px; }
.quest-level { border:1px solid var(--line); border-radius:6px; padding:3px 1px; background:#fff; font-size:9px; font-weight:900; text-align:center; }
.quest-level.locked { color:var(--ink-soft); background:#E6EBF3; }
.quest-level.cleared { color:#fff; background:var(--r3); border-color:var(--r3); }
.quest-level.goal { color:var(--ink); background:var(--yellow); border-color:var(--gold); }
.farm-grid { display:grid; gap:8px; }
.farm-card { display:grid; grid-template-columns:1fr auto; gap:3px 8px; padding:10px; border:2px solid var(--line); border-radius:12px; background:var(--paper); text-align:left; }
.farm-card strong { font-size:14px; }.farm-card small { color:var(--ink-soft); }.farm-card .farm-time { align-self:center; font-family:var(--dot); }
.quest-detail { max-width:520px; margin:0 auto; }
.quest-detail-hero { display:flex; gap:10px; align-items:center; padding:10px; border-radius:14px; background:var(--paper); }
.quest-detail-hero h2 { margin:0; font-size:18px; }.quest-detail-hero p { margin:1px 0; }
.quest-info { margin:10px 0; padding:10px; border-radius:12px; background:var(--paper); }
.quest-info dl { display:grid; grid-template-columns:5.7em 1fr; gap:6px 8px; margin:0; font-size:13px; }
.quest-info dt { color:var(--ink-soft); font-size:11px; font-weight:900; }.quest-info dd { margin:0; }
.quest-selected { display:flex; align-items:center; gap:8px; margin:10px 0; padding:8px; border:2px solid var(--line); border-radius:12px; background:var(--paper); }
.quest-selected > span:nth-child(2) { min-width:0; flex:1; }.quest-selected strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.quest-result-goal { margin-top:8px; padding:8px 10px; border-radius:10px; background:#fff; color:#1E2A4A; text-align:left; font-size:12px; }
.quest-result-goal b { font-size:15px; }.quest-result-goal .ok { color:#188A55; }.quest-result-goal .ng { color:#C6283D; }
.quest-result-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.quest-result-actions button { padding:7px 4px; border:0; border-radius:8px; font-weight:900; }
.proof-banner { margin:0 0 10px; padding:8px 10px; border:2px solid var(--gold); border-radius:10px; background:#FFF3C4; font-weight:900; }
@media (max-height: 680px) {
  .practice-battle { gap: 3px; }
  .practice-versus { min-height: 142px; }
  .practice-ind { display: none; }
  .practice-grade, .practice-hpnum { font-size: 9px; }
  .practice-actions button { padding-block: 5px; }
  .team-field { min-height:145px; }.team-battle.log-wide .team-field { min-height:110px; }
}
.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.streak div { text-align: center; border-radius: 8px; padding: 4px 0; background: #E6EBF3; font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.streak div b { display: block; font-family: var(--dot); font-weight: 400; font-size: 13px; color: var(--ink); }
.streak div.done { background: var(--ink); color: #B9C3DA; }
.streak div.done b { color: var(--yellow); }
.streak div.today { outline: 3px solid var(--yellow); }
.mission { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mission:last-child { border-bottom: 0; }
.mission .mt { font-weight: 700; }
.mission .mr { font-family: var(--dot); font-size: 13px; color: var(--ink-soft); }
.mission .bar { grid-column: 1 / -1; }
.bar { height: 6px; background: #E3E8F0; border-radius: 99px; margin: 4px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.bar i.hot { background: var(--red); }
.bar i.ok { background: var(--r2); }
.exp-slot { border: 2px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
.exp-slot.running { border-style: solid; border-color: var(--r3); }
.exp-slot.done { border-style: solid; border-color: var(--gold); background: #FFF8DF; }
.exp-head { display: flex; align-items: center; gap: 8px; }
.exp-head b { font-size: 15px; }
.exp-head .time { margin-left: auto; font-family: var(--dot); }
.party { display: flex; gap: 4px; margin: 6px 0; }
.dest-list { display: grid; gap: 6px; }
.dest { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.dest[aria-pressed="true"] { border-color: var(--ink); background: #E8EDF6; }
.dest b { display: block; }
.pick-list { max-height: 44vh; overflow-y: auto; margin: 8px 0; }
.estimate { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
.estimate b { font-family: var(--dot); font-weight: 400; color: var(--yellow); font-size: 18px; }

/* ---------- ランキング ---------- */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.filters label { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: flex; flex-direction: column; gap: 2px; }
.ranking-status { margin: 0 0 10px; padding: 7px 10px; border-radius: 9px; background: #E6EBF3; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
.ranking-status.online { background: #E0F3EA; color: #176B48; }
.ranking-status.error { background: #FFF0E3; color: #9A4D00; }
.rank-row.static { cursor: default; }

/* ---------- ダイアログ・個体票 ---------- */
dialog { border: 0; padding: 0; width: min(500px, calc(100vw - 20px)); max-height: calc(100vh - 40px); border-radius: 18px; background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(20, 28, 51, .6); }
.dlg-inner { padding: 16px; overflow-y: auto; max-height: calc(100vh - 40px); }
.dlg-close { position: sticky; top: 0; float: right; background: var(--ink); color: var(--paper); border: 0; border-radius: 99px; width: 32px; height: 32px; font-size: 18px; line-height: 1; z-index: 2; }
.specimen-head { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 3px solid var(--ink); }
.specimen-head h2 { margin: 0; font-size: 24px; line-height: 1.2; }
.serial { font-family: var(--dot); font-size: 15px; }
.speech { position: relative; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; margin: 12px 0 4px; }
.speech::before { content: ""; position: absolute; left: 26px; top: -9px; width: 14px; height: 14px; background: #fff; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); transform: rotate(45deg); }
.stats { list-style: none; padding: 0; margin: 0; }
.stat { padding: 10px 0; border-bottom: 1px solid var(--line); }
.stat-top { display: flex; align-items: baseline; gap: 8px; }
.stat-top .lbl { font-weight: 700; font-size: 13px; width: 6em; flex-shrink: 0; }
.stat-top .val { font-family: var(--dot); font-size: 20px; }
.stat-top .pct { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.stat-top .pct.hot { color: var(--red); }
.ranks { list-style: none; padding: 0; margin: 0; font-size: 12px; color: var(--ink-soft); }
.ranks b { font-family: var(--dot); font-weight: 400; color: var(--ink); font-size: 14px; }
.ranks .top10 b { color: var(--red); }
.actions { display: flex; gap: 8px; margin-top: 14px; }
.actions .btn { flex: 1; padding: 9px; }
dialog.confirm { width: min(380px, calc(100vw - 40px)); }
.confirm-msg { white-space: pre-line; margin: 0 0 4px; font-weight: 700; }

.b-rows { display: grid; grid-template-rows: auto auto; gap: 5px; margin: 6px 0; }

.unit { position: absolute; inset: 0; border-radius: 10px; background: #F6F8FB; color: var(--ink); border-top: 5px solid var(--el); overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 1px; transition: transform .18s; }
.unit.enter { animation: enter .35s; }

.unit .u-atk, .unit .u-hp { position: absolute; bottom: 2px; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-family: var(--dot); font-size: 14px; line-height: 24px; text-align: center; }

@keyframes bshake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

}

/* バトルのカード：絵を全面に広げ、数字を上に重ねる */
.unit { display: block; min-width: 0; min-height: 0; padding: 0; cursor: pointer; background: linear-gradient(#FFFFFF, #E9EEF6); overflow: hidden; }
.unit .u-art { position: absolute; inset: 0; min-width: 0; min-height: 0; overflow: hidden; }
.unit .u-art .art { position: absolute; inset: 1px; width: auto !important; height: auto !important; display: block; }
.unit .u-art .art img, .unit .u-art .art svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; transform: none !important; }
.ui-art .art img { transform: none !important; }
.unit .u-stats { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.unit .stat { position: absolute; display: flex; align-items: center; justify-content: center; gap: 1px; min-width: 25px; height: 20px; border-radius: 7px; padding: 0 4px 0 3px; border: 1px solid rgba(255,255,255,.8); color: #fff; font-family: var(--dot); font-size: 13px; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.9); box-shadow: 0 1px 3px rgba(0,0,0,.55); }
.unit .stat svg { width: 10px; height: 10px; flex-shrink: 0; fill: currentColor; opacity: .9; }
.unit .stat.atk { left: 3px; bottom: 3px; background: rgba(170,24,42,.88); color: #fff; }
.unit .stat.hp { right: 3px; bottom: 3px; background: rgba(20,116,72,.9); color: #fff; }
.unit .stat.spd { right: 3px; top: 3px; background: rgba(24,91,164,.9); color: #fff; }
.unit .stat.atk.up { background: #F08A00; box-shadow: inset 0 0 0 2px var(--yellow); }
.unit .stat.atk.down { background: #8E99A8; }
.unit .stat.hp.hurt { background: #D98A1F; }
.unit .stat.hp.low { background: var(--red); animation: pulseHp 1s infinite; }
@keyframes pulseHp { 50% { filter: brightness(1.3); } }
.unit .u-top { position: absolute; top: 3px; left: 3px; right: 32px; opacity: .95; display: flex; gap: 2px; align-items: flex-start; flex-wrap: wrap; z-index: 4; pointer-events: none; }
.unit .u-top .st { font-size: 9px; font-weight: 900; border-radius: 4px; padding: 0 3px; background: var(--ink); color: #fff; line-height: 13px; }
.unit .u-top .st.shield { background: var(--gold); color: var(--ink); }
.unit .u-top .st.poison { background: #7050A8; }
.unit .u-top .st.frz { background: #2E86DE; }
.unit .u-top .st.ult { background: transparent; color: var(--gold); font-size: 11px; padding: 0; }
.unit .u-top .kw { font-size: 9px; font-weight: 900; width: 14px; height: 14px; line-height: 14px; text-align: center; border-radius: 50%; background: rgba(30,42,74,.72); color: #fff; }
.unit .u-name { position: absolute; left: 2px; bottom: 1px; right: 40px; text-align: left; font-size: 10px; font-weight: 900; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; max-width: none; }
.unit .u-atk, .unit .u-hp, .unit .u-kw, .unit .u-status, .unit .u-ult { display: none; }
.stat-legend { display: flex; gap: 8px; justify-content: center; font-size: 10px; color: #B9C3DA; }
.stat-legend span { display: inline-flex; align-items: center; gap: 2px; }
.stat-legend svg { width: 10px; height: 10px; }
.unit-info { position: absolute; inset: 0; z-index: 34; background: rgba(12,17,32,.7); display: grid; place-items: center; padding: 16px; }
.ui-card { position: relative; background: var(--paper); color: var(--ink); border-radius: 16px; border-top: 8px solid var(--el); padding: 12px 14px; width: min(360px, 100%); max-height: 88vh; overflow-y: auto; animation: pop2 .2s; }
.ui-card .dlg-close { position: absolute; top: 8px; right: 8px; float: none; }
.ui-art { display: grid; place-items: center; height: 160px; background: radial-gradient(circle at 50% 60%, #fff, #E3E9F2); border-radius: 12px; }
.ui-art .art img, .ui-art .art svg { object-fit: contain; }
.ui-card h3 { margin: 8px 0 0; font-size: 18px; }
.ui-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.ui-stats div { background: #EEF2F7; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.ui-stats b { display: block; font-family: var(--dot); font-weight: 400; font-size: 24px; line-height: 1.1; }
.ui-stats b small { font-size: 13px; color: var(--ink-soft); }
.ui-stats div > small { font-size: 10px; }
.float { top: 22%; font-size: 24px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
